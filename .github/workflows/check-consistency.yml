name: Controlla coerenza dei fatti volatili (retta, scadenze, quota)

# Il sito ripete alcuni fatti che cambiano ogni anno (scadenza della
# domanda, quota di iscrizione, importo della retta, anno scolastico)
# in più pagine indipendenti e nelle risposte del chatbot — non esiste
# un solo posto da aggiornare. Se si modifica uno di questi valori in
# un punto e ci si dimentica degli altri, il sito continua a "funzionare"
# normalmente: nessun errore, nessuna pagina rotta, solo un'informazione
# sbagliata che resta lì finché qualcuno non se ne accorge per caso — è
# già successo due volte (vedi scripts/check-consistency.js). Questo
# controllo non impedisce la pubblicazione (GitHub Pages non ha un gate
# di build): serve solo a rendere visibile la discrepanza il prima
# possibile, con una ✗ rossa nella scheda Actions e, se le notifiche
# email di GitHub sono attive per questo repository, un'email.
#
# Gira ad ogni push su main (per un avviso immediato) E una volta a
# settimana (perché una modifica in un solo file — es. solo
# ammissione.html — è comunque un push che tocca il sito, ma nel tempo
# certi contenuti potrebbero essere aggiornati anche altrove, es. da
# un editor diverso): il controllo settimanale è una rete di sicurezza
# in più, a costo praticamente nullo.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'   # ogni lunedì alle 6:17 UTC

jobs:
  check-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verifica che i fatti volatili coincidano ovunque
        run: node scripts/check-consistency.js
