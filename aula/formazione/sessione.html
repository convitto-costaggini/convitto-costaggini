<!DOCTYPE html>
<html lang="it">
<head>
  <script>window.AULA_ATTESA_MANUALE=true</script>
  <script src="/aula/attesa.js"></script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Formazione pratica | Aula digitale | Convitto "Costaggini"</title>
  <meta name="theme-color" content="#2C3E2D"/>
  <link rel="stylesheet" href="/fonts.css"/>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <style>
    :root{--bosco:#2C3E2D;--bosco2:#3D5C3E;--oro:#B8922A;--oro2:#D4AA4A;--orot:#7A5C10;--panna:#F5F0E8;--panna2:#EDE6D6;--testo:#1f1f1f;--grigio:#555;
      --ok:#2A5A2B;--okbg:#E2EFE0;--no:#7A2D22;--nobg:#F6E6E3;
      --fd:'Cormorant Garamond',Georgia,serif;--fu:'Source Sans 3',Arial,sans-serif;--col:440px}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--panna);color:var(--testo);font-family:var(--fu);font-size:16px;line-height:1.5}
    a{color:var(--bosco2)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
    #tit:focus{outline:none}

    .app{display:grid;grid-template-columns:var(--col) 1fr;height:100vh;height:100dvh}
    .app.stretta{grid-template-columns:0 1fr}
    .app.stretta .guida{display:none}
    .app.grande{--col:540px}

    /* colonna a sinistra */
    .guida{display:flex;flex-direction:column;min-height:0;background:#fff;border-right:1px solid var(--panna2)}
    .testa{background:var(--bosco);color:var(--panna);padding:12px 16px 10px}
    .testa .sopra{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro2);font-weight:700}
    .testa h1{font-family:var(--fd);font-weight:400;font-size:26px;line-height:1.1;margin:3px 0 8px}
    .testa h1 em{color:var(--oro2)}
    .parti{display:flex;gap:6px;margin:0 0 8px}
    .parti button{flex:1;border:1px solid rgba(245,240,232,.55);background:transparent;color:var(--panna);border-radius:10px;padding:5px 8px;font-weight:700;font-size:14px;min-height:44px;text-align:left;line-height:1.2}
    .parti button small{display:block;font-weight:400;font-size:12.5px;opacity:.95}
    .parti button[aria-pressed="true"]{background:var(--panna);color:var(--bosco)}
    .barra{height:6px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
    .barra i{display:block;height:100%;width:0;background:var(--oro2);transition:width .25s}
    .mappa{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
    .mappa button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(245,240,232,.6);background:transparent;color:var(--panna);font-weight:700;font-size:13px;padding:0}
    .mappa button.fatto{background:var(--oro2);color:#2b2208;border-color:var(--oro2)}
    .mappa button.saltato{border-style:dashed}
    .mappa button[aria-current="step"]{background:var(--panna);color:var(--bosco);border-color:var(--panna)}

    .corpo{flex:1;min-height:0;overflow:auto;padding:16px 18px 12px}
    .et{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--orot);font-weight:700}
    .corpo h2{font-family:var(--fd);font-weight:500;font-size:28px;line-height:1.1;margin:.15rem 0 .6rem;color:var(--bosco)}
    .cosa{font-size:18px;line-height:1.45;margin:0 0 .8rem}
    .cosa b.bt{background:#f3ecd6;border-radius:6px;padding:0 .3em;font-weight:700;color:var(--bosco);white-space:nowrap}
    .dom{font-size:18px;font-weight:700;margin:0 0 .6rem;color:var(--bosco)}
    .opz{display:flex;flex-direction:column;gap:8px;margin:0 0 .7rem}
    .opz button{text-align:left;border:2px solid var(--bosco);background:#fff;color:var(--testo);border-radius:12px;padding:10px 12px;min-height:48px;font-size:16.5px}
    .opz button:hover{background:#FBF7EC}
    .opz button.giusta{background:var(--okbg);border-color:var(--ok)}
    .opz button.sbagliata{background:var(--nobg);border-color:var(--no)}
    .opz button[disabled]{cursor:default}
    .ctl{list-style:none;margin:.2rem 0 .7rem;padding:0}
    .ctl li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px dashed var(--panna2);font-size:16.5px}
    .ctl li:first-child{border-top:0}
    .ctl .sp{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid #b9ad92;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:transparent;background:#fff}
    .ctl li.ok .sp{background:var(--ok);border-color:var(--ok);color:#fff}
    .ctl li.ok{color:var(--ok);font-weight:700}
    .esito{min-height:1.4em;margin:0 0 .6rem;font-size:16.5px;font-weight:700}
    .esito.si{background:var(--okbg);color:var(--ok);border-radius:10px;padding:8px 12px}
    .esito.no{background:var(--nobg);color:var(--no);border-radius:10px;padding:8px 12px}
    .aiuto{border-top:1px solid var(--panna2);padding-top:10px;margin-top:.4rem}
    .aiuto>button,.az2 button,.card-az button{border:2px solid var(--bosco);background:#fff;color:var(--bosco);border-radius:10px;padding:6px 14px;font-weight:700;font-size:15px;min-height:44px}
    .aiuto>button[aria-expanded="true"]{background:var(--bosco);color:#fff}
    .aiuto .box{margin-top:8px;background:#FBF7EC;border-left:4px solid var(--oro);border-radius:0 10px 10px 0;padding:10px 12px;font-size:16px}
    .aiuto .box p{margin:0 0 .5rem}
    .az2{display:flex;flex-wrap:wrap;gap:8px}
    .az2 .pieno,.card-az .pieno{background:var(--bosco);color:#fff}
    .card-az{margin:.2rem 0 .6rem}
    .mancano{background:var(--nobg);color:var(--no);border-radius:10px;padding:8px 12px;margin:.3rem 0 .7rem;font-size:15.5px}

    .piede{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--panna2);background:#fff}
    .piede button{flex:1;min-height:48px;border-radius:12px;border:2px solid var(--bosco);background:#fff;color:var(--bosco);font-weight:700;font-size:16px}
    .piede .avanti{background:var(--bosco);color:#fff}
    .piede button[disabled]{opacity:.45;cursor:default}
    .piede .sito{display:none}

    /* spazio a destra: il sito vero */
    .vista{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
    .strumenti{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--panna2);border-bottom:1px solid #d9cfb8;font-size:14px}
    .strumenti .dove{flex:1;min-width:120px;color:var(--grigio);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .strumenti button,.strumenti a.b{border:1px solid #8f8466;background:#fff;color:var(--bosco);border-radius:8px;padding:5px 11px;font-weight:700;font-size:14px;text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
    .strumenti .passi{display:none}
    iframe{flex:1;width:100%;min-height:0;border:0;background:#fff}

    /* puntatore: un anello fermo con un breve richiamo, mai in ciclo continuo */
    .pt{position:absolute;z-index:15;overflow:hidden;pointer-events:none}
    .pt-r{position:absolute;display:none;border:3px solid #D4AA4A;border-radius:12px;box-shadow:0 0 0 4px rgba(212,170,74,.4),0 0 16px rgba(212,170,74,.55);animation:pt-polso 1.2s ease-in-out 3}
    .pt-t{position:absolute;display:none;transform:translateX(-50%);background:var(--bosco);color:#fff;font:700 14px/1.2 var(--fu);padding:7px 12px;border-radius:99px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.28)}
    .pt.on .pt-r,.pt.on .pt-t{display:block}
    @keyframes pt-polso{0%,100%{box-shadow:0 0 0 3px rgba(212,170,74,.3),0 0 10px rgba(212,170,74,.4)}50%{box-shadow:0 0 0 10px rgba(212,170,74,.2),0 0 22px rgba(212,170,74,.7)}}
    @media (prefers-reduced-motion:reduce){.pt-r{animation:none}.barra i{transition:none}}

    .app.grande .cosa,.app.grande .dom,.app.grande .ctl li,.app.grande .opz button{font-size:20px}

    @media (max-width:900px){
      .app,.app.stretta{display:flex;flex-direction:column;height:auto;min-height:100vh}
      .guida{border-right:0;border-bottom:3px solid var(--oro)}
      .corpo{overflow:visible}
      .vista{height:88vh;height:88dvh}
      .app.stretta .guida{display:none}
      .piede{position:sticky;bottom:0;z-index:5}
      .piede .sito{display:block;flex:0 0 auto;padding:0 12px}
      .strumenti .passi{display:inline-flex}
    }
    .app.chiusa{display:none}
    .fine{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px;background:var(--panna)}
    .fine.on{display:flex}
    .fine .sc{max-width:560px;width:100%;background:#fff;border:1px solid var(--panna2);border-top:5px solid var(--oro);border-radius:16px;padding:26px;box-shadow:0 8px 28px rgba(44,62,45,.12)}
    .fine h2{font-family:var(--fd);font-weight:500;font-size:30px;color:var(--bosco);margin:0 0 10px;text-align:center}
    .fine ul{list-style:none;margin:0 0 16px;padding:0}
    .fine li{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px dashed var(--panna2);font-size:16.5px}
    .fine li:first-child{border-top:0}
    .fine li .sp{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:var(--ok)}
    .fine li.no .sp{background:#fff;border:2px dashed #8f8466;color:var(--grigio)}
    .fine li button{margin-left:auto;border:2px solid var(--bosco);background:#fff;color:var(--bosco);border-radius:8px;font-weight:700;min-height:36px;padding:2px 10px}
    .fine .az{display:flex;flex-direction:column;gap:10px}
    .fine a.b,.fine .az button{display:block;min-height:48px;line-height:44px;border-radius:12px;border:2px solid var(--bosco);background:#fff;color:var(--bosco);font-weight:700;font-size:16px;text-decoration:none;text-align:center;padding:0 14px}
    .fine a.pri{background:var(--bosco);color:#fff}
    .strumenti a.esci{border-color:var(--bosco)}
  </style>
</head>
<body>
<noscript><p style="padding:24px;font-family:Arial,sans-serif">Questa pagina richiede JavaScript.</p></noscript>
<div class="app" id="app">
  <aside class="guida" aria-label="Passi da fare">
    <div class="testa">
      <div class="sopra">Aula digitale · formazione pratica</div>
      <h1>Prova tu, <em>sul sito vero</em></h1>
      <div class="parti" role="group" aria-label="Le due parti">
        <button type="button" id="p1" aria-pressed="true">Parte 1 · Insieme<small id="p1c"></small></button>
        <button type="button" id="p2" aria-pressed="false">Parte 2 · Da soli<small id="p2c"></small></button>
      </div>
      <div class="barra" aria-hidden="true"><i id="barra"></i></div>
      <nav class="mappa" id="mappa" aria-label="Passi di questa parte"></nav>
    </div>
    <div class="corpo" id="corpo"></div>
    <div class="piede">
      <button type="button" id="indietro">← Indietro</button>
      <button type="button" id="avanti" class="avanti">Avanti →</button>
      <button type="button" id="vaiSito" class="sito" title="Vai al sito">Sito ↓</button>
    </div>
  </aside>
  <section class="vista" id="vista" aria-label="Il sito">
    <div class="strumenti">
      <button type="button" id="largo" aria-pressed="false" title="Nasconde o mostra i passi">⇔ Passi</button>
      <button type="button" id="grande" aria-pressed="false" title="Ingrandisce il testo dei passi">A+</button>
      <button type="button" id="vaiPassi" class="passi">↑ Passi</button>
      <span class="dove" id="dove"></span>
      <button type="button" id="ricarica">↻ Ricarica</button>
      <a class="b esci" href="/aula/formazione/">✕ Esci</a>
      <a class="b" id="nuova" target="_blank" rel="noopener">Apri in una scheda nuova ↗</a>
    </div>
    <iframe id="sito" title="Il sito, dove provare i passi" allow="camera; clipboard-write; fullscreen" referrerpolicy="same-origin"></iframe>
    <div class="pt" id="pt" aria-hidden="true"><div class="pt-r"></div><div class="pt-t"></div></div>
  </section>
</div>
<div class="fine" id="fine" role="region" aria-label="Formazione completata">
  <div class="sc">
    <h2>Formazione completata</h2>
    <ul id="riepilogo"></ul>
    <div class="az">
      <a class="b pri" href="/aula/formazione/">Torna alla pagina Formazione</a>
      <a class="b" href="/aula/">Torna all'Aula</a>
      <button type="button" id="rivedi">Rivedi i passi</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var DEMO = '/aula/studio/lezione.html?c=DEMO';
  var CREA = '/aula/studio/docente.html';
  var MIE = '/aula/studio/docente.html#mie';

  /* ───── aiuti per i controlli ───── */
  function vuota(c) { var s = c.ls('aula-supporti'); return !s || !(s.car || s.sp || s.ri || s.vl || s.ca || s.fo || s.te || s.z || s.tema); }
  function accesso() { try { var o = JSON.parse(localStorage.getItem('studio-sessione') || 'null'); return !!(o && o.t && o.scade > Date.now()); } catch (e) { return false; } }
  function tappaCorrente(c) {
    var l = c.d ? c.d.querySelectorAll('.st-tappa') : [];
    for (var i = 0; i < l.length; i++) if (l[i].getAttribute('aria-current') === 'step') return i;
    return -1;
  }

  /* ───── i passi ─────
     tipo 'azione': controlli che si spuntano da soli quando il collega fa davvero la cosa;
     tipo 'scelta': domande con risposta unica, con riscontro subito;
     tipo 'soglia': passaggio da una parte all'altra.
     mostra: dove tocca il puntatore (selettore, elenco di selettori o funzione). */
  var T = [
    /* ───── PARTE 1: INSIEME ───── */
    { id: 'ingresso', p: 1, tipo: 'azione', t: 'Entra nella Sala studio', url: '/aula/',
      cosa: `Tocca «Sala studio».`,
      sugg: `Le due schede sono nella sezione «Per gli studenti»: scegli la seconda.`,
      controlli: [{ k: 'a', t: 'Sala studio aperta', ok: function (c) { return /^\/aula\/studio\/(index\.html)?$/.test(c.path); },
        mostra: function (c) { return c.q('a.au-card[href="aula/studio/"]'); } }],
      fine: `Qui entrano i ragazzi: senza account e senza registrazione.` },

    { id: 'scelta-ingresso', p: 1, tipo: 'scelta', t: 'Come entrano i ragazzi?',
      domande: [{ q: `Vuoi far studiare una classe. Che cosa dai agli studenti per entrare?`, opz: [
        [`Un account a testa`, false, `No: nell'Aula gli studenti non hanno account.`],
        [`Il codice o il QR della lezione`, true, `Giusto: lo stesso codice vale per tutta la classe.`],
        [`Un link con il nome di ciascuno`, false, `No: niente nomi. Un codice per lezione, mai per persona.`]] }] },

    { id: 'codice', p: 1, tipo: 'azione', t: 'Entra con il codice', url: '/aula/studio/',
      cosa: `Scrivi DEMO nel campo «CODICE» e tocca «Entra →».`,
      sugg: `Il campo è nella parte alta della pagina, sopra «Prova subito». Le lettere si scrivono anche in minuscolo.`,
      controlli: [
        { k: 'a', t: 'Codice scritto', ok: function (c) { return /c=DEMO/.test(c.url) || c.val('#sx-c').toUpperCase() === 'DEMO'; }, mostra: '#sx-c', et: 'Scrivi qui' },
        { k: 'b', t: 'Lezione aperta', ok: function (c) { return /c=DEMO/.test(c.url); }, mostra: '#sx-form button[type="submit"]' }],
      fine: `Lezione aperta con il codice, come farebbe uno studente.` },

    { id: 'percorso', p: 1, tipo: 'azione', t: 'Scegli come studiare', url: DEMO,
      cosa: `In «Come vuoi studiare?» tocca «Percorso guidato».`,
      sugg: `È il primo dei sette riquadri sotto il titolo della lezione.`,
      controlli: [{ k: 'a', t: 'Percorso guidato avviato', ok: function (c) { return c.clic(function (e) { return e.m === 'percorso'; }); }, mostra: '[data-m="percorso"]' }],
      fine: `Sette tappe, dal gancio alla sfida finale. Gli altri sei modi sono nello stesso menu.` },

    { id: 'tappe', p: 1, tipo: 'azione', t: 'Vai avanti nel percorso', url: DEMO,
      cosa: `Arriva alla tappa «Memorizza»: tocca «Capito →» e poi «Prossima tappa →».`,
      sugg: `Se una risposta è sbagliata non succede nulla: il sistema la spiega. Puoi anche toccare direttamente «3. Memorizza» nella fila delle tappe.`,
      controlli: [{ k: 'a', t: 'Tappa «Memorizza» raggiunta', ok: function (c) { return tappaCorrente(c) >= 2; },
        mostra: function (c) { return c.trova('Capito') || c.trova('Prossima tappa') || c.trova('Memorizza'); } }],
      fine: `Raggiunta la terza tappa: le idee sono già fatte.` },

    { id: 'scelta-lettura', p: 1, tipo: 'scelta', t: 'Un alunno fatica a leggere',
      domande: [{ q: `Un alunno fatica a leggere la lezione. Che cosa fai?`, opz: [
        [`Gli chiedo davanti alla classe qual è il problema`, false, `No: nessuno deve dichiarare un motivo.`],
        [`Mostro a tutta la classe il pulsante «Aa Leggi a modo tuo»`, true, `Giusto: è lo stesso per tutti e ognuno sceglie da sé.`],
        [`Preparo per lui una versione con il suo nome`, false, `No: niente nomi e niente etichette sulle versioni.`]] }] },

    { id: 'aa', p: 1, tipo: 'azione', t: 'Apri «Leggi a modo tuo»', url: DEMO, lettura: true,
      cosa: `Tocca «Aa Leggi a modo tuo», in basso a sinistra.`,
      sugg: `Il pulsante tondo con le lettere «Aa» resta sempre visibile sulla lezione, in basso a sinistra.`,
      controlli: [{ k: 'a', t: 'Pannello aperto', ok: function (c) { var p = c.q('#sup-pann'); return !!(p && !p.hidden); }, mostra: '#sup-btn' }],
      fine: `Il pannello è uguale per tutti: carattere, spazi, colori, voce.` },

    { id: 'lettura', p: 1, tipo: 'azione', t: 'Prova due letture', url: DEMO, lettura: true,
      cosa: `Nella «Scelta rapida» tocca «Lettura 1», poi «Lettura 3».`,
      sugg: `Se il pannello si è chiuso, riaprilo con «Aa». I tre pulsanti sono in alto.`,
      controlli: [
        { k: 'a', t: 'Lettura 1', ok: function (c) { return c.clic(function (e) { return e.p === '1'; }); }, mostra: ['[data-p="1"]', '#sup-btn'] },
        { k: 'b', t: 'Lettura 3', ok: function (c) { return c.clic(function (e) { return e.p === '3'; }); }, mostra: ['[data-p="3"]', '#sup-btn'] }],
      fine: `Con un solo tocco cambia tutta la pagina.` },

    { id: 'standard', p: 1, tipo: 'azione', t: 'Torna come prima', url: DEMO, lettura: true,
      cosa: `Tocca «↺ Ripristina tutto».`,
      sugg: `È in fondo al pannello. Scorri il pannello verso il basso.`,
      controlli: [{ k: 'a', t: 'Lettura ripristinata', ok: function (c) { return vuota(c); }, mostra: ['[data-ripristina]', '#sup-btn'] }],
      fine: `Ognuno può tornare allo standard quando vuole.` },

    { id: 'accesso', p: 1, tipo: 'azione', t: 'Entra nell’area docenti', url: CREA,
      cosa: `Scrivi la mail della scuola (basta nome.cognome) e tocca «Mandami il codice →». Poi incolla le sei cifre e tocca «Entra →».`,
      sugg: `Il messaggio si chiama «Il tuo codice di accesso». Non lo vedi? Guarda in Spam. Il codice vale 10 minuti: se scade tocca «Rimanda il codice».`,
      controlli: [
        { k: 'a', t: 'Codice richiesto', ok: function (c) { return accesso() || c.clic(function (e) { return /mandami il codice/.test(e.tx); }); }, mostra: function (c) { return c.trova('Mandami il codice'); } },
        { k: 'b', t: 'Accesso fatto', ok: function () { return accesso(); }, mostra: function (c) { return c.trova('Entra'); } }],
      fine: `Accesso fatto: resta valido 60 giorni su questo dispositivo.` },

    { id: 'istruzioni', p: 1, tipo: 'azione', t: 'Crea una lezione (1): le istruzioni', url: CREA, accesso: true,
      cosa: `Scrivi un argomento (per esempio «Il sistema HACCP») e tocca «Copia le istruzioni».`,
      sugg: `Il campo si chiama «Argomento / titolo della lezione». Gli altri campi sono facoltativi.`,
      controlli: [
        { k: 'a', t: 'Argomento scritto', ok: function (c) { return c.val('#dc-arg').trim().length >= 3 || c.clic(function (e) { return e.id === 'dc-copia-prompt' && (e.arg || '').trim().length >= 3; }); }, mostra: '#dc-arg', et: 'Scrivi qui' },
        { k: 'b', t: 'Istruzioni copiate', ok: function (c) { return c.clic(function (e) { return e.id === 'dc-copia-prompt' && (e.arg || '').trim().length >= 3; }); }, mostra: '#dc-copia-prompt' }],
      fine: `Istruzioni copiate: ora servono all’assistente.` },

      m += '<button type="button" class="' + cl + '" data-i="' + T.indexOf(x) + '"' + (x === t ? ' aria-current="step"' : '') + ' aria-label="' + (x.tipo === 'soglia' ? 'Introduzione' : (x.p === 2 ? 'Missione ' + x.m : 'Passo ' + (k + 1))) + ': ' + esc(x.t) + (mem.fatti[x.id] ? ' (fatto)' : mem.saltati[x.id] ? ' (saltato)' : '') + '">' + (x.tipo === 'soglia' ? '→' : x.p === 2 ? x.m : k + 1) + '</button>';
    });
    $('mappa').innerHTML = m;
    $('indietro').disabled = idx <= 0;
    var ultimo = idx >= T.length - 1;
    $('avanti').textContent = t.tipo === 'soglia' ? 'Comincia →' : ultimo ? 'Concludi ✓' : 'Avanti →';
    $('avanti').disabled = !(t.tipo === 'soglia' || fatto(t));
    segnaControlli();
    var a = $('aiuto'); if (a) a.hidden = !!mem.fatti[t.id];
    if (t.tipo === 'azione' && mem.fatti[t.id]) { var f = typeof t.fine === 'function' ? t.fine(ctx()) : t.fine; mostraEsito('✓ ' + f, 'si'); }
    else if (t.tipo === 'azione' && mem.saltati[t.id]) mostraEsito('Passo saltato: puoi tornarci dalla mappa.', '');
    else if (t.tipo === 'scelta' && mem.fatti[t.id] && $('esito') && !$('esito').textContent) mostraEsito('✓ Fatto.', 'si');
  }
  function vai(i, sposta) {
    if (i < 0 || i >= T.length) return;
    var prima = T[idx];
    if (prima && prima.lettura && !T[i].lettura && i !== idx) ripristinaLettura();
    idx = i; mem.idx = i; salva();
    var t = T[i];
    if (!inizio[t.id]) inizio[t.id] = Date.now();
    togli();
    if (t.url) {
      if (!stessa(t.url)) carica(t.url);
      else if (/#mie$/.test(t.url)) { try { sito.contentWindow.location.hash = '#mie'; } catch (e) {} }
    }
    try { history.replaceState(null, '', location.pathname + location.search + '#' + t.id); } catch (e) {}
    disegna(sposta !== false);
    setTimeout(giro, 200);
  }

  corpo.addEventListener('click', function (e) {
    var t = T[idx];
    var o = e.target.closest('#opz button');
    if (o && t.tipo === 'scelta') {
      var qi = mem.q[t.id] || 0, D = t.domande[qi], op = D.opz[+o.getAttribute('data-o')];
      var bs = corpo.querySelectorAll('#opz button');
      if (op[1]) {
        for (var i = 0; i < bs.length; i++) bs[i].disabled = true;
        o.classList.add('giusta'); mostraEsito('✓ ' + op[2], 'si');
        if (qi < t.domande.length - 1) {
          $('cardAz').innerHTML = '<button type="button" class="pieno" id="prossima">Prossima domanda →</button>';
        } else { mem.fatti[t.id] = 1; salva(); aggiorna(); }
      } else {
        o.classList.add('sbagliata'); o.disabled = true; mostraEsito('✗ ' + op[2] + ' Riprova.', 'no');
      }
      return;
    }
    if (e.target.closest('#prossima')) { mem.q[t.id] = (mem.q[t.id] || 0) + 1; salva(); disegna(false); var op0 = corpo.querySelector('#opz button'); if (op0) op0.focus(); return; }
    var n = e.target.closest('#nonso');
    if (n) { var b = $('aiutoBox'), ap = b.hidden; b.hidden = !ap; n.setAttribute('aria-expanded', ap ? 'true' : 'false'); return; }
    if (e.target.closest('#mostra')) {
      mem.mostra[t.id] = true; salva();
      var c = ctx(), trovato = false;
      for (var j = 0; j < t.controlli.length; j++) { var k = t.controlli[j]; if (mem.ok[t.id + '.' + k.k]) continue; if (risolvi(c, k.mostra)) trovato = true; break; }
      if (!trovato) mostraEsito('Non vedo il punto in questa pagina: tocca «Apri la pagina del passo».', 'no');
      giro(); return;
    }
    if (e.target.closest('#riapri')) { if (t.url) { carica(t.url); mostraEsito('', ''); } return; }
    if (e.target.closest('#salta')) { mem.saltati[t.id] = 1; salva(); togli(); aggiorna(); return; }
  });
  $('mappa').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) vai(+b.getAttribute('data-i')); });
  $('p1').onclick = function () { vai(T.indexOf(deiPasso(1)[0])); };
  $('p2').onclick = function () { vai(T.indexOf(deiPasso(2)[0])); };
  $('indietro').onclick = function () { vai(idx - 1); };
  $('avanti').onclick = function () {
    if (idx >= T.length - 1) { concludi(); return; }
    vai(idx + 1);
  };
  function concludi() {
    if (T[idx].lettura) ripristinaLettura();
    var h = '';
    T.filter(function (t) { return t.tipo !== 'soglia'; }).forEach(function (t) {
      var ok = !!mem.fatti[t.id];
      h += '<li class="' + (ok ? '' : 'no') + '"><span class="sp" aria-hidden="true">' + (ok ? '✓' : '–') + '</span><span>' + esc(t.t) + (ok ? '' : (mem.saltati[t.id] ? ' (saltato)' : ' (da fare)')) + '</span>' + (ok ? '' : '<button type="button" data-i="' + T.indexOf(t) + '">Rifai</button>') + '</li>';
    });
    $('riepilogo').innerHTML = h;
    $('app').classList.add('chiusa'); $('fine').classList.add('on'); window.scrollTo(0, 0);
  }
  $('riepilogo').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; $('fine').classList.remove('on'); $('app').classList.remove('chiusa'); vai(+b.getAttribute('data-i')); });
  $('rivedi').onclick = function () { $('fine').classList.remove('on'); $('app').classList.remove('chiusa'); window.scrollTo(0, 0); };
  $('ricarica').onclick = function () { if (vistaAttiva) carica(vistaAttiva); };
  $('largo').onclick = function () { var s = $('app').classList.toggle('stretta'); this.setAttribute('aria-pressed', s ? 'true' : 'false'); };
  $('grande').onclick = function () { var s = $('app').classList.toggle('grande'); this.setAttribute('aria-pressed', s ? 'true' : 'false'); };
  $('vaiSito').onclick = function () { $('vista').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  $('vaiPassi').onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  window.addEventListener('pagehide', function () { if (T[idx] && T[idx].lettura) { try { localStorage.removeItem('aula-supporti'); } catch (e) {} } });
  window.addEventListener('resize', function () { if (puntoEl) posiziona(); });

  var hh = (location.hash || '').replace('#', '');
  T.forEach(function (t, k) { if (t.id === hh) idx = k; });
  vai(idx, false);
})();
</script>
</body>
</html>
