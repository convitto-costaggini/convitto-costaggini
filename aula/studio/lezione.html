<body data-page="studio">

<script src="nav-header.min.js"></script>

<main id="main">
  <section class="st-hero">
    <div class="w">
      <p class="lbl" id="st-mat">Sala studio</p>
      <h1 id="st-tit">Un momento…</h1>
      <p id="st-sot">Sto preparando la lezione.</p>
      <span class="st-badge" id="st-cod" hidden></span>
    </div>
  </section>
  <div id="st-ripasso" class="st-palco" style="padding-bottom:0"></div>

  <div id="st-app"></div>
  <p class="st-nota st-ia" id="st-ia" style="font-style:italic;text-align:center;margin:1.2rem auto 2rem;padding:0 16px;max-width:60rem" hidden>Lezione preparata dal docente con l'ausilio di AI, e da lui rivista.</p>
</main>
<script src="nav.min.js"></script>
<script src="supabase.js"></script>
<script src="aula/lingue/pacchetto.js"></script>
<script src="aula/lingue/finestra.js"></script>

<script src="aula/studio/formati.js?v=20261117"></script>
<script src="aula/studio/demo.js"></script>
<script src="aula/studio/ripasso.js"></script>
<script>
(function () {
  var esc = STUDIO.esc, $ = function (id) { return document.getElementById(id); };
  function errore(tit, t) {
    if (window.AulaAttesa) AulaAttesa.fine();
    $('st-tit').textContent = tit; $('st-sot').textContent = t;
    $('st-app').innerHTML = '<div class="st-palco st"><div class="st-card st-avviso"><p style="margin:0">' + esc(t) + '</p><div class="st-azioni"><a class="st-btn pieno" href="aula/studio/lezione.html?c=DEMO">Prova la lezione di esempio</a><a class="st-btn" href="aula/studio/">Sala studio</a></div></div></div>';
  }
  function mostra(L, id) {
    if (window.AulaAttesa) AulaAttesa.fine();
    document.title = L.titolo + ' – Sala studio | Convitto "Costaggini"';
    $('st-mat').textContent = L.materia || 'Sala studio';
    $('st-tit').innerHTML = '<span class="ic" aria-hidden="true">' + esc(L.icona || '📚') + '</span>' + esc(L.titolo);
    $('st-sot').textContent = L.sottotitolo || '';
    if (id && id !== 'DEMO' && id.length === 6) { $('st-cod').hidden = false; $('st-cod').textContent = 'Codice ' + id; }
    /* le lezioni della Sala studio le prepara chi insegna con l'IA; la lezione di esempio no */
    if (id !== 'DEMO') $('st-ia').hidden = false;
    modi(L, id);
    /* se è il giorno del ripasso di questa lezione lo propone; se no, un riscaldamento sull'ultima lezione fatta */
    if (window.RIPASSO) RIPASSO.invito($('st-ripasso'), id);
  }
  /* «Come vuoi studiare?»: la stessa lezione in undici modi (?m= nel link) */
  var MODI = [
    ['percorso', '🧭', 'Percorso guidato', '7 tappe, da solo'],
    ['escape', '🔐', 'Escape room', 'apri i lucchetti'],
    ['mappa', '🗺️', 'Costruisci la mappa', 'ogni idea al suo posto'],
    ['caccia', '🔍', 'Caccia all\'errore', 'correggi il compagno'],
    ['intervista', '🎭', 'Intervista impossibile', 'fai il giornalista'],
    ['minuto', '⚡', 'Il minuto', 'quante in 60 secondi?'],
    ['memory', '🃏', 'Memory', 'trova le coppie'],
    ['detective', '🕵️', 'Il detective', 'indovina dagli indizi'],
    ['sicuro', '🎲', 'Quanto sei sicuro?', 'rispondi e scommetti'],
    ['parola', '🔤', 'Indovina la parola', 'una lettera alla volta'],
    ['squadre', '🏆', 'Sfida a squadre', 'alla LIM, con la classe']
  ];
  function modi(L, id) {
    var q = new URLSearchParams(location.search), m = q.get('m'), aperto = !m;
    if (!MODI.some(function (x) { return x[0] === m; })) m = 'percorso';
    /* la scelta si vede tutta all'inizio; dopo, resta una riga sola con «Cambia modo» */
    function barra() {
      var x = MODI.filter(function (y) { return y[0] === m; })[0];
      $('st-modi').innerHTML = '<nav class="fm-modi st" aria-label="Come vuoi studiare?">' + (aperto
        ? '<p class="fm-modi-t">Come vuoi studiare?</p><div class="fm-modi-r">' + MODI.map(function (y) {
            return '<button type="button" data-m="' + y[0] + '" aria-pressed="' + (y[0] === m) + '"><span class="ic" aria-hidden="true">' + y[1] + '</span><b>' + y[2] + '</b><small>' + y[3] + '</small></button>';
          }).join('') + '</div>'
        : '<div class="fm-modi-chiuso"><span>Stai studiando con: <b>' + x[1] + ' ' + x[2] + '</b></span><button type="button" data-cambia aria-expanded="false">Cambia modo ▾</button></div>') + '</nav>';
    }
    function apri() {
      STUDIO.zitto();
      /* un contenitore nuovo a ogni cambio: nessun resto del modo di prima */
      var vecchio = $('st-app'), nuovo = document.createElement('div'); nuovo.id = 'st-app'; vecchio.parentNode.replaceChild(nuovo, vecchio);
      if (m === 'percorso') STUDIO.avvia(L, nuovo, { id: id });
      else if (window.FORMATI && typeof FORMATI[m] === 'function') { try { sessionStorage.removeItem('studio-ricarica'); } catch (e) {} nuovo.classList.add('st'); FORMATI[m](L, nuovo); }
      else {
        /* il browser ha tenuto in memoria i giochi di una versione precedente: si ricarica una volta da capo */
        var gia = false; try { gia = sessionStorage.getItem('studio-ricarica') === m; sessionStorage.setItem('studio-ricarica', m); } catch (e) {}
        if (!gia) { var u2 = new URL(location.href); u2.searchParams.set('r', Date.now()); location.replace(u2); return; }
        nuovo.innerHTML = '<div class="st-palco st"><div class="st-card st-avviso"><p style="margin:0">Questo modo non si è caricato: il dispositivo sta usando una copia vecchia della pagina. Chiudi e riapri il browser, poi riprova.</p></div></div>';
      }
    }
    $('st-modi').addEventListener('click', function (e) {
      if (e.target.closest('[data-cambia]')) { aperto = true; barra(); var p = $('st-modi').querySelector('[aria-pressed="true"]'); if (p) p.focus(); return; }
      var b = e.target.closest('[data-m]'); if (!b) return;
      m = b.getAttribute('data-m'); aperto = false;
      var u = new URL(location.href);
      if (m === 'percorso') u.searchParams.delete('m'); else u.searchParams.set('m', m);
      history.replaceState(null, '', u);
      barra(); apri();
      $('st-modi').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    barra(); apri();
  }
  window.addEventListener('hashchange', function () { location.reload(); });
  var q = new URLSearchParams(location.search), c = (q.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var h = location.hash.match(/[#&]l=([A-Za-z0-9_-]+)/);
  if (c === 'DEMO') return mostra(window.STUDIO_DEMO, 'DEMO');
  if (h) return window.PACCHETTO.decodifica(h[1]).then(function (L) { if (!L || !L.titolo || !Array.isArray(L.concetti)) throw 0; mostra(L, 'link-' + h[1].slice(-12)); })
    .catch(function () { errore('Lezione non trovata', 'Il link è incompleto: forse è stato copiato solo in parte. Chiedi all\'educatore di mandarlo di nuovo.'); });
  if (!/^[A-Z2-9]{6}$/.test(c)) return errore('Quale lezione?', 'Inquadra il codice QR che trovi in sala studio, oppure scrivi il codice di 6 lettere nella pagina della Sala studio.');
  fetch(SUPABASE_URL + '/rest/v1/rpc/studio_lezione', {
    method: 'POST', headers: { 'apikey': SUPABASE_PUB, 'Authorization': 'Bearer ' + SUPABASE_PUB, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_codice: c })
  }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (L) {
    if (!L || !L.titolo) return errore('Lezione non trovata', 'Il codice ' + c + ' non corrisponde a nessuna lezione. Controlla le lettere o inquadra di nuovo il QR.');
    mostra(L, c);
  }).catch(function () { errore('Connessione assente', 'Non riesco a scaricare la lezione. Controlla la connessione e ricarica la pagina.'); });
})();
</script>
</body>
</html>
