<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <script src="/aula/riservato.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="robots" content="noindex, nofollow"/>
  <title>Visita per i docenti | Sala studio | Convitto "Costaggini"</title>
  <meta name="theme-color" content="#2C3E2D"/>
  <link rel="stylesheet" href="/fonts.css"/>
  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <style>
    :root{--bosco:#2C3E2D;--bosco2:#3D5C3E;--oro:#B8922A;--oro2:#D4AA4A;--panna:#F5F0E8;--panna2:#EDE6D6;--testo:#1f1f1f;--grigio:#5b5b5b;
      --fd:'Cormorant Garamond',Georgia,serif;--fu:'Source Sans 3',Arial,sans-serif;--col:430px}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--panna);color:var(--testo);font-family:var(--fu);font-size:16px;line-height:1.55}
    a{color:var(--bosco2)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--oro);outline-offset:2px}

    .app{display:grid;grid-template-columns:var(--col) 1fr;height:100vh;height:100dvh}
    .app.stretta{grid-template-columns:0 1fr}
    .app.stretta .guida{display:none}

    /* colonna a sinistra: i passi */
    .guida{display:flex;flex-direction:column;min-height:0;background:#fff;border-right:1px solid var(--panna2)}
    .testa{background:var(--bosco);color:var(--panna);padding:14px 18px 12px}
    .testa .sopra{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--oro2);font-weight:700}
    .testa h1{font-family:var(--fd);font-weight:400;font-size:28px;line-height:1.1;margin:4px 0 8px}
    .testa h1 em{color:var(--oro2)}
    .comandi{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
    .comandi button{border:1px solid rgba(245,240,232,.55);background:transparent;color:var(--panna);border-radius:8px;padding:5px 10px;font-weight:700;font-size:13.5px;min-height:32px}
    .comandi button[aria-pressed="true"]{background:var(--panna);color:var(--bosco)}
    .comandi .tempo{font-variant-numeric:tabular-nums;min-width:4.6em;text-align:center}
    .barra{height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
    .barra i{display:block;height:100%;width:0;background:var(--oro2);transition:width .25s}
    .conta{font-size:13px;color:rgba(245,240,232,.88);margin-top:6px}
    .elenco{flex:1;min-height:0;overflow:auto;list-style:none;margin:0;padding:6px 0 10px}
    .elenco>li{border-bottom:1px solid var(--panna2)}
    .capo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:11px 16px;color:var(--bosco)}
    .capo:hover{background:#FBF7EC}
    .capo .n{flex:0 0 32px;height:32px;border-radius:50%;background:var(--panna2);color:var(--bosco);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:19px;font-weight:700}
    .capo .t{flex:1;font-weight:700;font-size:16px;line-height:1.25}
    .capo .m{display:block;font-weight:400;font-size:12.5px;color:var(--grigio)}
    li.attiva .capo{background:#FBF7EC}
    li.attiva .capo .n{background:var(--bosco);color:var(--oro2)}
    li.fatta .capo .n{background:var(--oro);color:#fff}
    .corpo{display:none;padding:2px 18px 16px 60px;font-size:15.5px}
    li.attiva .corpo{display:block}
    .corpo p{margin:.2rem 0 .6rem}
    .corpo ul.az{list-style:none;padding:0;margin:.4rem 0}
    .corpo ul.az>li{padding:6px 0;border-bottom:1px dashed var(--panna2)}
    .corpo ul.az>li:last-child{border-bottom:0}
    .corpo label.sp{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
    .corpo label.sp input{width:20px;height:20px;margin-top:2px;accent-color:var(--bosco);flex:0 0 auto}
    .corpo .btn{display:inline;background:var(--panna);border:1px solid var(--panna2);border-radius:6px;padding:0 7px;font-weight:700;font-size:14.5px;color:var(--bosco);-webkit-box-decoration-break:clone;box-decoration-break:clone}
    .viste{display:flex;flex-wrap:wrap;gap:6px;margin:.5rem 0 .3rem}
    .viste button{border:2px solid var(--bosco);background:#fff;color:var(--bosco);border-radius:10px;padding:5px 10px;font-weight:700;font-size:14px;min-height:36px}
    .viste button[aria-pressed="true"]{background:var(--bosco);color:#fff}
    .avviso{background:#FBF7EC;border-left:4px solid var(--oro);border-radius:0 10px 10px 0;padding:8px 12px;margin:.5rem 0;font-size:14.5px}
    .perche{background:#EEF4EC;border-left:4px solid var(--bosco2);border-radius:0 10px 10px 0;padding:8px 12px;margin:.3rem 0 .6rem;font-size:14.5px}
    .perche b.e{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--bosco2);margin-bottom:2px}
    .risp{margin:.55rem 0 .3rem;padding:8px 10px;border:1px solid var(--panna2);border-radius:10px;font-size:14px;background:#fff}
    .risp b.e{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--grigio);margin-bottom:3px}
    .risp .r{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:3px 0}
    .risp .c{flex:1 1 100%}
    .pr,.dp{border-radius:6px;padding:0 7px;font-weight:700;font-size:13.5px;white-space:nowrap}
    .pr{background:#F6E6E3;color:#7A2D22}
    .dp{background:#E2EFE0;color:#2A5A2B}
    .sf{font-size:13px;color:var(--grigio);margin-top:4px}

    /* moduli dentro i passi */
    .modulo{border:1px solid var(--panna2);border-radius:12px;padding:10px 12px;margin:.6rem 0;background:#FDFBF6}
    .modulo label{display:block;font-weight:700;font-size:14px;margin:.5rem 0 .15rem;color:var(--bosco)}
    .modulo label:first-child{margin-top:0}
    .modulo input[type=text],.modulo input[type=number],.modulo select,.modulo textarea{width:100%;border:2px solid #cfc4a8;border-radius:8px;padding:7px 9px;background:#fff;color:var(--testo);font-size:16px}
    .modulo textarea{min-height:76px;resize:vertical}
    .modulo .az2{display:flex;flex-wrap:wrap;gap:8px;margin-top:.7rem}
    .modulo .az2 button{min-height:44px;border-radius:10px;border:2px solid var(--bosco);background:#fff;color:var(--bosco);font-weight:700;padding:6px 14px}
    .modulo .az2 button.pieno{background:var(--bosco);color:#fff}
    .esito{font-size:14.5px;margin:.5rem 0 0;min-height:1.4em}
    table.calc{width:100%;border-collapse:collapse;font-size:13.5px;margin:.4rem 0}
    table.calc th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grigio);text-align:left;padding:2px 3px}
    table.calc td{padding:4px 3px;border-top:1px dashed var(--panna2);vertical-align:middle}
    table.calc td.n input{width:58px;padding:5px 6px;text-align:right}
    table.calc input[type=checkbox]{width:18px;height:18px;accent-color:var(--bosco)}
    .modulo .due{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .totali{background:var(--bosco);color:var(--panna);border-radius:12px;padding:10px 12px;margin:.6rem 0;font-size:15px}
    .totali b{color:var(--oro2);font-size:17px}
    .totali .grande{font-family:var(--fd);font-size:24px;line-height:1.15;color:#fff;display:block;margin:.2rem 0}
    .non{margin:.4rem 0;padding-left:1.1rem;font-size:14.5px}
    .non li{margin:.15rem 0}

    .piede{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--panna2);background:#fff}
    .piede button{flex:1;min-height:46px;border-radius:12px;border:2px solid var(--bosco);background:#fff;color:var(--bosco);font-weight:700;font-size:16px}
    .piede .avanti{background:var(--bosco);color:#fff}
    .piede button[disabled]{opacity:.4;cursor:default}
    .piede .sito{display:none}

    /* lo spazio grande a destra: il sito vero */
    .vista{display:flex;flex-direction:column;min-width:0;min-height:0}
    .strumenti{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--panna2);border-bottom:1px solid #d9cfb8;font-size:14px}
    .strumenti .dove{flex:1;min-width:120px;color:var(--grigio);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .strumenti button,.strumenti a.b{border:1px solid #b9ad92;background:#fff;color:var(--bosco);border-radius:8px;padding:5px 11px;font-weight:700;font-size:14px;text-decoration:none;min-height:34px}
    .strumenti .passi{display:none}
    iframe{flex:1;width:100%;min-height:0;border:0;background:#fff}

    @media (max-width:900px){
      .app,.app.stretta{display:flex;flex-direction:column;height:auto;min-height:100vh}
      .guida{max-height:none;border-right:0;border-bottom:3px solid var(--oro)}
      .elenco{overflow:visible}
      .vista{height:88vh;height:88dvh}
      .app.stretta .guida{display:none}
      .corpo{padding-left:18px}
      .piede{position:sticky;bottom:0;z-index:5}
      .piede .sito{display:block;flex:0 0 auto;padding:0 12px}
      .strumenti .passi{display:inline-block}
    }
    .app.chiusa{display:none}
    .fine{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px;background:var(--panna)}
    .fine.on{display:flex}
    .fine .sc{max-width:520px;width:100%;background:#fff;border:1px solid var(--panna2);border-top:5px solid var(--oro);border-radius:16px;padding:28px 26px;box-shadow:0 8px 28px rgba(44,62,45,.12);text-align:center}
    .fine h2{font-family:var(--fd);font-weight:500;font-size:30px;color:var(--bosco);margin:0 0 6px}
    .fine p{margin:0 0 18px;color:var(--grigio)}
    .fine .az2{display:flex;flex-direction:column;gap:10px}
    .fine a.b,.fine button{display:block;min-height:48px;line-height:44px;border-radius:12px;border:2px solid var(--bosco);background:#fff;color:var(--bosco);font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;padding:0 14px}
    .fine a.pri{background:var(--bosco);color:#fff}
    .strumenti a.esci{border-color:var(--bosco)}
    @media print{
      .fine{display:none!important}
      html,body{height:auto}
      .app{display:block;height:auto}
      .vista,.piede,.comandi,.barra,.modulo .az2,.viste{display:none!important}
      .guida{border:0}
      .elenco{overflow:visible}
      .corpo{display:block!important;padding-left:18px}
      .capo{padding-left:0}
      li{break-inside:avoid}
    }
  </style>
</head>
<body>
<noscript><p style="padding:24px;font-family:Arial,sans-serif">Questa guida richiede JavaScript.</p></noscript>
<div class="app" id="app">
  <aside class="guida" aria-label="Guida passo passo">
    <div class="testa">
      <div class="sopra">Sala studio · visita per i docenti</div>
      <h1>Meno fatica, <em>più scuola</em></h1>
      <div class="comandi">
        <button type="button" id="breve" aria-pressed="false" title="Mostra solo i passi essenziali">Solo l'essenziale</button>
        <button type="button" id="cronoBtn" aria-pressed="false" title="Avvia o ferma il cronometro">⏱ Avvia</button>
        <button type="button" class="tempo" id="cronoVal" title="Tempo trascorso">00:00</button>
        <button type="button" id="cronoZero" title="Azzera il cronometro">Azzera</button>
      </div>
      <div class="barra" aria-hidden="true"><i id="barra"></i></div>
      <div class="conta" id="conta" aria-live="polite"></div>
    </div>
    <ol class="elenco" id="elenco"></ol>
    <div class="piede">
      <button type="button" id="indietro">← Indietro</button>
      <button type="button" id="avanti" class="avanti">Avanti →</button>
      <button type="button" id="vaiSito" class="sito" title="Vai al sito">Sito ↓</button>
    </div>
  </aside>
  <section class="vista" id="vista" aria-label="Il sito">
    <div class="strumenti">
      <button type="button" id="largo" aria-pressed="false" title="Nasconde o mostra la guida">⇔ Guida</button>
      <button type="button" id="vaiPassi" class="passi">↑ Passi</button>
      <span class="dove" id="dove"></span>
      <button type="button" id="ricarica">↻ Ricarica</button>
      <a class="b esci" href="/aula/formazione/">✕ Esci</a>
      <a class="b" id="nuova" target="_blank" rel="noopener">Apri in una scheda nuova ↗</a>
    </div>
    <iframe id="sito" title="Il sito, per provare i passi indicati a sinistra" allow="camera; clipboard-write; fullscreen" referrerpolicy="same-origin"></iframe>
  </section>
</div>
<div class="fine" id="fine" role="region" aria-label="Visita completata">
  <div class="sc">
    <h2>Visita completata</h2>
    <p id="fineTesto">Grazie per aver provato l'Aula.</p>
    <div class="az2">
      <a class="b pri" href="/aula/formazione/">Torna alla pagina Formazione</a>
      <a class="b" href="/aula/">Torna all'Aula</a>
      <a class="b" href="/">Vai alla home del sito</a>
      <button type="button" id="rivedi">Rivedi la visita</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var DEMO = '/aula/studio/lezione.html?c=DEMO';
  var MAIL = ['michele.gaggiano', 'alberghierorieti.it'].join('@');

  /* Le attività di cui si calcola il tempo. p = minuti che servono a mano (stima prudente), d = minuti con la Sala studio,
     rilettura compresa. Sono stime di partenza, non misure: chi usa la pagina le può cambiare. */
  var LAVORI = [
    { k: 'lezione', c: 'Preparare la lezione: spiegazione, esempi, esercizi e flashcard', p: 90, d: 15 },
    { k: 'attivita', c: 'Ideare altre attività sullo stesso argomento (mappa, enigmi, gioco)', p: 40, d: 3 },
    { k: 'lim', c: 'Preparare un quiz a squadre per la lavagna', p: 40, d: 3 },
    { k: 'verifica', c: 'Scrivere la verifica con fila A, fila B e soluzioni', p: 60, d: 8 },
    { k: 'piu-aiuti', c: 'Adattare la verifica in una versione con più aiuti', p: 45, d: 2 },
    { k: 'mappa', c: 'Preparare la mappa delle idee chiave da consegnare', p: 30, d: 2 }
  ];
  function lavoro(k) { for (var i = 0; i < LAVORI.length; i++) if (LAVORI[i].k === k) return LAVORI[i]; return null; }
  function durata(m) {
    m = Math.round(m); if (m < 60) return m + ' min';
    var h = Math.floor(m / 60), r = m % 60; return h + ' h' + (r ? ' ' + (r < 10 ? '0' : '') + r + ' min' : '');
  }

  /* I passi. url: la pagina che si apre a destra; viste: altre pagine dello stesso passo;
     ripristina: il passo cambia l'aspetto della pagina, quindi all'uscita si rimette tutto com'era;
     breve: il passo resta anche nel percorso essenziale; risp: le voci di tempo (chiavi di LAVORI). */
  var TAPPE = [
    { id: 'inizio', t: 'Benvenuto', min: 2, breve: true, url: '/aula/studio/index.html',
      intro: 'Questa pagina accompagna a provare la Sala studio: a sinistra i passi, a destra il sito vero, che si può toccare e usare senza rompere nulla.',
      perche: 'La Sala studio nasce per togliere lavoro a chi insegna, non per aggiungerne. In questo percorso si segue l\'intero ciclo: preparare, far studiare, verificare, adattare, condividere. Alla fine si calcola quanto tempo si risparmia.',
      azioni: [
        'A destra c\'è la pagina d\'ingresso di uno studente: un solo campo per il codice, nessuna registrazione, nessun dato richiesto.',
        'In alto a sinistra, <span class="btn">⏱ Avvia</span> fa partire un cronometro: serve a misurare il tempo vero dei compiti che seguono. Si può fermare e azzerare in ogni momento.',
        '<span class="btn">Solo l\'essenziale</span> riduce il percorso ai passi indispensabili (circa 30 minuti); premuto di nuovo, torna il percorso completo.'
      ],
      nota: 'Gli strumenti sono ancora in anteprima: si aprono soltanto con il link ricevuto. Il sito non raccoglie dati degli studenti.' },

    { id: 'studente', t: 'Una lezione che lo studente fa da solo', min: 6, breve: true, url: DEMO, risp: ['lezione'],
      intro: 'Prima di vedere come si prepara, si guarda il risultato: è una lezione di esempio di Scienza e cultura dell\'alimentazione sui principi nutritivi.',
      perche: 'Se la lezione non serve ai ragazzi, tutto il resto non conta. Per questo si parte da ciò che vede uno studente: idee una alla volta, trucchi per ricordare, esercizi che spiegano gli errori.',
      azioni: [
        'Alla domanda «Come vuoi studiare?» si sceglie <span class="btn">🧭 Percorso guidato</span> e si parte dal gancio: una domanda curiosa che apre l\'argomento.',
        'Su una scheda si tocca <span class="btn">🔊</span>: il testo viene letto ad alta voce.',
        'Nella tappa <b>Memorizza</b> si osservano i trucchi per ricordare: la parola-sigla, il «palazzo della memoria» nel Convitto, la filastrocca che sparisce parola per parola.',
        'Nella tappa <b>Allenati</b> si risponde sbagliando apposta: la lezione spiega subito perché.',
        'Si provano le <b>Flashcard</b>, la <b>Sfida finale</b> e la pagina <b>Da ricordare</b>.',
        'Si notano i <b>tempi</b> (la durata di tutta la lezione e di ogni tappa) e, dopo tre tappe di fila, l\'invito facoltativo a una pausa di 2 minuti.',
        'Finite le idee chiave si prova <span class="btn">💬 Spiegalo a un compagno</span>: si scrive un\'idea con parole proprie e la si confronta con la spiegazione; il controllo segnala la parola chiave e una spiegazione troppo breve.',
        'Arrivati a <b>Da ricordare</b>, la lezione viene annotata sul dispositivo: domani, tra 3 giorni e tra una settimana la home della Sala studio proporrà <b>🔁 Oggi ripassa</b>; aprendo un\'altra lezione compare un <b>☀️ riscaldamento</b> su questa. Il ripasso a distanza lo organizza la Sala studio, non il docente.',
        '<b>Con occhio da esperto:</b> si controllano i contenuti (le kcal per grammo, le vitamine idrosolubili e liposolubili, le funzioni dei nutrienti). Ciò che non convince si annota per il passo finale.'
      ],
      nota: 'Il progresso, il ripasso e ciò che si scrive restano soltanto sul dispositivo di chi studia: il sito non registra nomi né risultati.' },

    { id: 'modi', t: 'Sette modi di studiare la stessa lezione', min: 4, url: DEMO, risp: ['attivita'],
      intro: 'Dalla stessa lezione nascono attività diverse, senza che il docente ne prepari nessuna. Si torna all\'inizio della lezione e si scelgono gli altri modi.',
      perche: 'Cambiare modo di studiare tiene viva l\'attenzione e permette di tornare più volte sullo stesso argomento senza annoiare.',
      azioni: [
        'Si sceglie <span class="btn">🔐 Escape room</span>: lucchetti da aprire, una lettera per lucchetto, la porta finale.',
        'Si sceglie <span class="btn">🗺️ Costruisci la mappa</span>: ogni idea va al suo posto, prima con aiuti, poi a memoria.',
        'Si sceglie <span class="btn">🔍 Caccia all\'errore</span>: il riassunto di un compagno distratto, da correggere.',
        'Si sceglie <span class="btn">🎭 Intervista impossibile</span>: l\'ospite risponde e si sceglie la risposta vera.',
        'Si sceglie <span class="btn">⚡ Il minuto</span>: quante risposte giuste in 60 secondi.'
      ] },

    { id: 'lavagna', t: 'Alla lavagna, con tutta la classe', min: 4, url: DEMO, risp: ['lim'],
      intro: 'È il modo per usare la lezione in aula, con la LIM o il proiettore, oppure in sala studio con un gruppo.',
      perche: 'Funziona anche quando i ragazzi non hanno il telefono: partecipano a voce o per alzata di mano, senza dispositivi e senza fornire dati.',
      azioni: [
        'Tra i modi di studiarla si sceglie <span class="btn">🏆 Sfida a squadre</span>, si indica quante squadre e si preme <span class="btn">⛶ Schermo intero</span>.',
        'Il docente tocca sulla lavagna la risposta data a voce dalla squadra: turni, rubapalla e classifica sono già pronti.',
        'Il punteggio resta sempre in vista; a fine gara compare la classifica.'
      ] },

    { id: 'crea', t: 'Dal libro alla lezione: si crea la propria', min: 8, breve: true, url: '/aula/studio/docente.html', risp: [], mia: true,
      intro: 'È il passo che fa risparmiare più tempo. Da un argomento, o dalla foto di una pagina del libro, nasce una lezione completa con il suo QR.',
      perche: 'Il docente non scrive la lezione: la fa preparare e poi la rilegge. Il lavoro che resta, quello che richiede competenza, è decidere che cosa va bene e che cosa si corregge.',
      azioni: [
        'Si inserisce l\'argomento del prossimo lavoro in classe nel riquadro qui sotto e si preme <span class="btn">Preparalo nel sito</span>: a destra la pagina si apre già compilata.',
        'Se compare la richiesta di accesso: si scrive la mail della scuola (basta <b>nome.cognome</b>), si preme <span class="btn">Mandami il codice →</span> e si scrive il codice di 6 cifre ricevuto, valido 10 minuti. Non serve alcuna password.',
        'Si scende fino al riquadro <b>«📸 Creazione automatica»</b>, si può allegare la foto di una pagina del libro e si preme <span class="btn">✨ Crea la lezione</span>. L\'attesa è di un paio di minuti.',

  /* ───── cronometro ───── */

  function tempoTesto(ms) {

        $('cu').value = 2; $('cm').value = 9; calcola();
      };
      calcola();
    }
    var pm = $('pa-mail');
    if (pm) {
      pm.onclick = function () {
        var t = testoParere();
        var u = 'mailto:' + MAIL + '?subject=' + encodeURIComponent('Sala studio: il mio parere') + '&body=' + encodeURIComponent(t);
        if (u.length > 1900) $('pa-esito').textContent = 'Il testo è lungo e la mail potrebbe non riceverlo tutto: si usa «Copia il testo» e lo si incolla nella mail.';
        else $('pa-esito').textContent = 'Si apre il programma di posta con il messaggio già scritto. Se non si apre, si usa «Copia il testo».';
        location.href = u;
      };
      $('pa-copia').onclick = function () {
        var t = testoParere();
        function ok() { $('pa-esito').textContent = 'Testo copiato: si incolla in una mail a ' + MAIL + '.'; }
        function ripiego() {
          var x = document.createElement('textarea'); x.value = t; x.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(x); x.select();
          try { document.execCommand('copy'); ok(); } catch (e) { $('pa-esito').textContent = 'Non riesco a copiare: si seleziona il testo a mano.'; }
          document.body.removeChild(x);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, ripiego); else ripiego();
      };
    }
  }
  function testoParere() {
    var fatti = visibili.filter(fatta).length, v = function (id) { return ($(id) || {}).value || ''; };
    var r = ['Ciao Michele,', 'ho provato la Sala studio.', ''];
    r.push('Passi completati: ' + fatti + ' di ' + visibili.length + '.');
    if (crTrascorso() > 0) r.push('Tempo misurato con il cronometro: ' + tempoTesto(crTrascorso()) + '.');
    if (v('pa-uso')) r.push('La userei nelle mie classi: ' + v('pa-uso') + '.');
    r.push('', 'Contenuti di Alimentazione (corretti o da correggere):', v('pa-cont') || 'nessuna osservazione.');
    r.push('', 'Che cosa mi farebbe risparmiare ancora più tempo:', v('pa-altro') || 'nessuna osservazione.');
    if (v('pa-nome')) r.push('', v('pa-nome'));
    return r.join('\n');
  }

  /* ───── comandi generali ───── */
  elenco.addEventListener('click', function (e) {
    var c = e.target.closest('.capo'); if (c) { vai(+c.getAttribute('data-i')); return; }
    var v = e.target.closest('.viste button');
    if (v) { var p = visibili[corrente]; carica(p.viste[+v.getAttribute('data-v')][1]); aggiornaStato(); }
  });
  elenco.addEventListener('change', function (e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-k'); if (!k) return;
    if (e.target.checked) spunte[k] = 1; else delete spunte[k];
    salvaSpunte(); aggiornaStato();
  });
  $('indietro').onclick = function () { vai(corrente - 1); };
  $('avanti').onclick = function () {
    if (corrente >= visibili.length - 1) {
      if (visibili[corrente].ripristina) ripristinaLettura();
      crFerma();
      var nf = visibili.filter(fatta).length;
      $('fineTesto').textContent = 'Hai spuntato ' + nf + ' passi su ' + visibili.length + (crTrascorso() > 1000 ? ' in ' + tempoTesto(crTrascorso()) : '') + '. Grazie per aver provato l\'Aula.';
      app.classList.add('chiusa'); $('fine').classList.add('on'); window.scrollTo(0, 0);
      return;
    }
    vai(corrente + 1);
  };
  $('rivedi').onclick = function () { $('fine').classList.remove('on'); app.classList.remove('chiusa'); window.scrollTo(0, 0); };
  $('ricarica').onclick = function () { if (vistaAttiva) carica(vistaAttiva); };
  $('largo').onclick = function () { var s = app.classList.toggle('stretta'); this.setAttribute('aria-pressed', s ? 'true' : 'false'); };
  $('vaiSito').onclick = function () { $('vista').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  $('vaiPassi').onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('breve').onclick = function () {
    var id = corrente >= 0 ? visibili[corrente].id : TAPPE[0].id;
    solo = !solo; this.setAttribute('aria-pressed', solo ? 'true' : 'false');
    visibili = TAPPE.filter(function (p) { return !solo || p.breve; });
    var i = 0; visibili.forEach(function (p, k) { if (p.id === id) i = k; });
    var salvaMia = { a: ($('mia-arg') || {}).value, m: ($('mia-mat') || {}).value };
    costruisci();
    if ($('mia-arg') && salvaMia.a) { $('mia-arg').value = salvaMia.a; $('mia-mat').value = salvaMia.m; }
    corrente = -1; vai(i, true);
  };
  window.addEventListener('pagehide', function () { var p = corrente >= 0 && visibili[corrente]; if (p && p.ripristina) { try { localStorage.removeItem('aula-supporti'); } catch (e) {} } });

  costruisci();
  var h = (location.hash || '').replace('#', ''), inizio = 0;
  visibili.forEach(function (p, k) { if (p.id === h) inizio = k; });
  vai(inizio);
})();
</script>
</body>
