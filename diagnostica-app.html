<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#2C3E2D"/>
  <title>Controllo dell'app | Convitto "Costaggini" — Rieti</title>
  <link rel="stylesheet" href="fonts.css"/>
  <link rel="stylesheet" href="style.min.css"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <script src="app.js" defer></script>
  <style>
  body{background:var(--av,#F5F0E8)}
  .dg{max-width:560px;margin:0 auto;padding:2rem 1rem 3rem;font-family:var(--fu,sans-serif)}
  .dg h1{font-family:var(--fd,Georgia,serif);font-weight:300;font-size:1.8rem;color:var(--bosco,#2C3E2D);margin:0 0 .3rem}
  .dg>p{font-size:.85rem;color:var(--txt2,#4A4840);line-height:1.6;margin:0 0 1.25rem}
  .dg table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--av3,#D9CEB5);border-radius:10px;overflow:hidden;font-size:.8rem}
  .dg td{padding:.5rem .7rem;border-top:1px solid var(--av2,#EDE5D4);vertical-align:top;word-break:break-word}
  .dg td:first-child{font-weight:700;color:var(--bosco,#2C3E2D);width:42%}
  .ok{color:#047857;font-weight:700}.no{color:#b91c1c;font-weight:700}
  .dg-b{display:grid;gap:.6rem;margin-top:1.25rem}
  .dg-b button{font:800 .7rem var(--fu,sans-serif);letter-spacing:.08em;text-transform:uppercase;padding:.85rem 1rem;border-radius:9px;cursor:pointer;border:1.5px solid var(--bosco,#2C3E2D);background:#fff;color:var(--bosco,#2C3E2D)}
  .dg-b button.pieno{background:var(--bosco,#2C3E2D);color:#fff}
  .dg small{display:block;margin-top:1rem;font-size:.72rem;color:#6b7280;line-height:1.5}
  </style>
</head>
<body>
<main class="dg">
  <h1>Controllo dell'app</h1>
  <p>Fai uno screenshot di questa pagina e mandalo a chi cura il sito. Non contiene dati personali.</p>
  <table><tbody id="dg-t"><tr><td>Controllo in corso…</td><td></td></tr></tbody></table>
  <div class="dg-b">
    <button type="button" class="pieno" id="dg-mostra">📲 Mostra l'invito adesso</button>
    <button type="button" id="dg-azzera">↻ Azzera le copie dell'app e ricarica</button>
  </div>
  <small>"Azzera" cancella solo le pagine del sito salvate su questo telefono e la scelta "Non ora": le spunte della valigia e del primo giro restano.</small>
</main>
<script>
(function () {
  function sì(v) { return v ? '<span class="ok">sì</span>' : '<span class="no">no</span>'; }
  async function controlla() {
    var A = window.CONVITTO_APP, righe = [];
    var ua = navigator.userAgent;
    righe.push(['Browser', ua]);
    righe.push(['Versione app.js in uso', A ? '<span class="ok">' + A.versione + '</span>' : '<span class="no">vecchia (prima della 3)</span>']);
    try {
      var srv = await (await fetch('app.js?controllo=' + Date.now(), { cache: 'no-store' })).text();
      var m = srv.match(/versione: '(\d+)'/);
      righe.push(['Versione app.js sul sito', m ? m[1] : '?']);
    } catch (e) { righe.push(['Versione app.js sul sito', '<span class="no">non raggiungibile</span>']); }
    if (A) {
      var i = A.info();
      righe.push(['Riconosciuto come telefono', sì(i.telefono)]);
      righe.push(['iPhone/iPad', sì(i.ios)]);
      righe.push(['Già aperto come app', sì(i.installata)]);
      righe.push(['Installazione diretta offerta', sì(i.installazioneDiretta)]);
      righe.push(['Pagine visitate', i.preferenze.pagine || 0]);
      righe.push(['"Non ora" attivo fino al', i.preferenze.noFinoA ? new Date(i.preferenze.noFinoA).toLocaleDateString('it-IT') : '—']);
    }
    righe.push(['Modalità di visualizzazione', ['standalone', 'minimal-ui', 'fullscreen', 'browser'].filter(function (d) { return matchMedia('(display-mode: ' + d + ')').matches; }).join(', ') || '?']);
    if ('serviceWorker' in navigator) {
      var reg = await navigator.serviceWorker.getRegistration();
      righe.push(['Service worker', reg ? (reg.active ? '<span class="ok">attivo</span>' : 'in installazione') : '<span class="no">assente</span>']);
      righe.push(['Pagina gestita dal service worker', sì(!!navigator.serviceWorker.controller)]);
    } else righe.push(['Service worker', '<span class="no">non supportato</span>']);
    if (window.caches) { var k = await caches.keys(); righe.push(['Copie salvate', k.join(', ') || '—']); }
    righe.push(['Schermo', screen.width + '×' + screen.height + ' · tocco: ' + (navigator.maxTouchPoints || 0)]);
    righe.push(['Data', new Date().toLocaleString('it-IT')]);
    document.getElementById('dg-t').innerHTML = righe.map(function (r) { return '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>'; }).join('');
  }
  window.addEventListener('load', function () { setTimeout(controlla, 1500); });
  document.getElementById('dg-mostra').addEventListener('click', function () {
    if (window.CONVITTO_APP) window.CONVITTO_APP.mostra();
    else alert('Il telefono sta usando una versione vecchia dell\'app: premi "Azzera le copie dell\'app e ricarica".');
  });
  document.getElementById('dg-azzera').addEventListener('click', async function () {
    try { localStorage.removeItem('convitto-app-v1'); } catch (e) {}
    if (window.caches) { var k = await caches.keys(); await Promise.all(k.map(function (n) { return caches.delete(n); })); }
    if ('serviceWorker' in navigator) { var r = await navigator.serviceWorker.getRegistrations(); await Promise.all(r.map(function (x) { return x.unregister(); })); }
    location.replace('diagnostica-app.html?t=' + Date.now());
  });
})();
</script>
</body>
</html>
