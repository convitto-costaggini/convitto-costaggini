<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <base href="/"/>
  <meta name="robots" content="noindex"/>
  <title>Visita guidata | Le lingue dell'Alberghiero</title>
  <meta name="description" content="Visita guidata e interattiva del minisito Le lingue dell'Alberghiero per il Dipartimento di Lingue: il sito vero, spiegato passo dopo passo."/>
  <meta name="theme-color" content="#0b150e"/>
  <link rel="stylesheet" href="fonts.css"/>
  <link rel="stylesheet" href="lingue/lingue.css"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>
  <style>
  :root{--bosco:#2C3E2D;--bosco2:#3D5C3E;--bosco3:#4A6E4B;--oro:#B8922A;--oro2:#D4AA4A;--oro3:#EDD98A;--av:#F5F0E8;--av2:#EDE5D4;--av3:#D9CEB5;--bco:#FDFAF5;--txt:#1A1A18;--txt2:#4A4840;--fd:'Cormorant Garamond',Georgia,serif;--fu:'Source Sans 3',system-ui,sans-serif;--sh-sm:0 2px 10px rgba(44,62,45,.1)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b150e;color:var(--txt);font-family:var(--fu);overflow:hidden}
  button{font-family:inherit}
  .app{display:grid;height:100vh;height:100dvh;grid-template-rows:auto auto minmax(0,1fr) auto}
  .top{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;background:#0b150e;color:#f5f0e8;border-bottom:1px solid rgba(237,217,138,.18)}
  .top a.es{color:var(--oro3);text-decoration:none;font:800 .62rem var(--fu);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
  .top .ti{flex:1;text-align:center;font-family:var(--fd);font-size:1.05rem;color:#f5f0e8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top button{background:transparent;border:1.5px solid rgba(237,217,138,.4);color:var(--oro3);font:800 .62rem var(--fu);letter-spacing:.1em;text-transform:uppercase;padding:.45rem .7rem;border-radius:999px;cursor:pointer;white-space:nowrap}
  .top button:hover,.top button[aria-pressed=true]{background:var(--oro);border-color:var(--oro);color:#fff}
  .prog{display:flex;gap:3px;padding:0 .9rem .5rem;background:#0b150e}
  .prog i{flex:1;height:4px;border-radius:3px;background:rgba(245,240,232,.16);cursor:pointer}
  .prog i.fatto{background:rgba(212,170,74,.55)}
  .prog i.ora{background:var(--oro2)}
  .prog i.cuore{background:rgba(242,201,76,.3)}
  .prog i.cuore.fatto,.prog i.cuore.ora{background:#f2c94c}
  .corpo{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;min-height:0}
  @media (min-width:960px){.corpo{grid-template-columns:minmax(330px,34%) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}}
  .guida{order:2;position:relative;min-height:0;overflow:auto;padding:1.1rem 1.2rem 1.4rem;background:linear-gradient(170deg,#0e1a11,#1c2e20);color:#f5f0e8;max-height:42vh}
  @media (min-width:960px){.guida{order:1;max-height:none;padding:2.2rem 2rem 2rem;border-right:1px solid rgba(237,217,138,.2)}}
  .guida::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 60% at 0% 0%,rgba(184,146,42,.16),transparent 70%);pointer-events:none}
  .g-in{position:relative}
  .g-etichetta{display:inline-flex;align-items:center;gap:.5rem;font:800 .6rem var(--fu);letter-spacing:.2em;text-transform:uppercase;color:var(--oro2);margin-bottom:.5rem}
  .g-onda{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
  .g-onda i{width:3px;background:var(--oro2);border-radius:2px;animation:onda 1.1s ease-in-out infinite}
  .g-onda i:nth-child(1){height:5px}.g-onda i:nth-child(2){height:11px;animation-delay:.15s}.g-onda i:nth-child(3){height:7px;animation-delay:.3s}.g-onda i:nth-child(4){height:10px;animation-delay:.45s}
  .guida.ferma .g-onda i{animation:none}
  @keyframes onda{50%{transform:scaleY(.4)}}
  .g-parte{font:700 .72rem var(--fu);letter-spacing:.06em;color:rgba(245,240,232,.6);margin:0 0 .3rem}
  .g-parte.cuore{color:#f2c94c}
  .g-tit{font-family:var(--fd);font-weight:400;font-size:clamp(1.6rem,3.2vw,2.5rem);line-height:1.1;color:#fff;margin:.1rem 0 1rem;opacity:0;filter:blur(8px);transform:translateY(10px);transition:opacity 1.6s ease,filter 1.6s ease,transform 1.6s ease}
  .g-tit.on{opacity:1;filter:none;transform:none}
  .g-b{font-family:var(--fd);font-style:italic;font-size:clamp(1.08rem,1.7vw,1.45rem);line-height:1.5;color:#f5f0e8;margin:0 0 .9rem;padding-left:.9rem;border-left:2px solid rgba(237,217,138,.5);opacity:0;filter:blur(8px);transform:translateY(12px);transition:opacity 2s ease,filter 2s ease,transform 2s ease,border-color 1.2s}
  .g-b.on{opacity:1;filter:none;transform:none}
  .g-b.vecchio{opacity:.52;border-left-color:rgba(237,217,138,.2)}
  .g-b.ultimo{border-left-color:var(--oro2)}
  @media (prefers-reduced-motion:reduce){.g-tit,.g-b{transition:none;filter:none;transform:none}.palco.entra>*{animation:none!important}}
  .palco{order:1;position:relative;min-height:0;display:flex;align-items:center;justify-content:center;padding:.9rem;background:radial-gradient(120% 90% at 50% 0%,#e9e1cf,#cfc3a6);overflow:hidden}
  @media (min-width:960px){.palco{order:2;padding:1.3rem 1.6rem}}
  .palco.entra>*{animation:entra .7s ease both}
  @keyframes entra{from{opacity:0;transform:translateY(14px) scale(.985)}}
  .etic{position:absolute;left:50%;top:.5rem;transform:translateX(-50%);z-index:5;display:inline-flex;align-items:center;gap:.45rem;font:800 .58rem var(--fu);letter-spacing:.14em;text-transform:uppercase;background:#fff;color:var(--bosco);padding:.32rem .75rem;border-radius:999px;box-shadow:0 4px 14px rgba(20,34,22,.18);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
  .palco.entra>.etic{animation:none}
  .etic .p{width:8px;height:8px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 0 rgba(22,163,74,.6);animation:punto 1.6s infinite}
  .etic.oro{background:var(--oro);color:#fff}
  @keyframes punto{70%{box-shadow:0 0 0 7px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
  .tel{background:#111;border-radius:34px;padding:11px;box-shadow:0 26px 54px rgba(20,34,22,.34);height:calc(100% - 1.6rem);max-height:740px;aspect-ratio:9/17.5;max-width:100%;margin-top:1.6rem}
  .tel .sc{width:100%;height:100%;border-radius:24px;overflow:hidden;background:var(--av)}
  .fin{width:100%;max-width:1000px;height:calc(100% - 1.6rem);max-height:640px;margin-top:1.6rem;background:#2a2a28;border-radius:14px;padding:30px 7px 7px;box-shadow:0 26px 54px rgba(20,34,22,.34);position:relative}
  .fin::before{content:"";position:absolute;left:12px;top:11px;width:9px;height:9px;border-radius:50%;background:#ff6159;box-shadow:15px 0 #ffbd2e,30px 0 #28c941}
  .fin .url{position:absolute;left:70px;right:12px;top:6px;height:19px;border-radius:6px;background:#3b3b38;color:#bbb;font:600 .62rem var(--fu);display:flex;align-items:center;padding:0 .6rem;overflow:hidden;white-space:nowrap}
  .fin .sc{width:100%;height:100%;border-radius:7px;overflow:hidden;background:var(--av)}
  .tel iframe,.fin iframe{width:100%;height:100%;border:0;display:block;background:var(--av)}
  .nat{width:100%;max-width:1000px;height:calc(100% - 1.6rem);margin-top:1.6rem;background:var(--bco);border:1px solid var(--av3);border-radius:18px;box-shadow:0 22px 48px rgba(20,34,22,.25);overflow:auto;padding:1.4rem 1.4rem 1.6rem}
  .nat.oro{border:2px solid var(--oro)}
  .nat h3{font-family:var(--fd);font-weight:400;font-size:1.5rem;color:var(--bosco);margin:0 0 .6rem;line-height:1.2}
  .nat p{line-height:1.65}
  .nota{font-size:.82rem;color:var(--txt2);line-height:1.6}
  .com{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.6rem .9rem calc(.6rem + env(safe-area-inset-bottom));background:#0b150e;border-top:1px solid rgba(237,217,138,.18)}
  .com .n{font:700 .74rem var(--fu);letter-spacing:.08em;color:rgba(245,240,232,.65);white-space:nowrap}
  .com button{font:800 .72rem var(--fu);letter-spacing:.1em;text-transform:uppercase;padding:.8rem 1.4rem;border-radius:999px;border:1.5px solid var(--oro2);background:transparent;color:var(--oro3);cursor:pointer}
  .com button.av{background:var(--oro);border-color:var(--oro);color:#fff}
  .com button.av.pronto{animation:pulsa 1.4s ease-in-out infinite}
  .com button:disabled{opacity:.35;cursor:default}
  @keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(212,170,74,.7)}50%{box-shadow:0 0 0 10px rgba(212,170,74,0)}}
  @media (prefers-reduced-motion:reduce){.com button.av.pronto{animation:none}}
  .ind{position:fixed;inset:0;z-index:100;background:rgba(8,16,10,.95);display:none;overflow:auto;padding:1.4rem 1.2rem}
  .ind.aperto{display:block}
  .ind .w{max-width:760px;margin:0 auto}
  .ind h2{font-family:var(--fd);font-weight:400;font-size:2rem;color:#fff;margin:.2rem 0 1rem}
  .ind h3{font:800 .66rem var(--fu);letter-spacing:.16em;text-transform:uppercase;color:var(--oro2);margin:1.3rem 0 .4rem}
  .ind h3.cuore{color:#f2c94c}
  .ind a{display:flex;gap:.7rem;align-items:baseline;color:#f5f0e8;text-decoration:none;padding:.5rem .7rem;border-radius:10px;font-size:1rem}
  .ind a:hover,.ind a.qui{background:rgba(237,217,138,.14)}
  .ind a b{font:800 .66rem var(--fu);color:var(--oro2);min-width:1.6rem}
  .ind .chiudi{position:fixed;right:1rem;top:1rem;background:var(--oro);color:#fff;border:0;border-radius:999px;font:800 .66rem var(--fu);letter-spacing:.1em;text-transform:uppercase;padding:.6rem 1rem;cursor:pointer}
  .pz-saluto{font-family:var(--fd);font-style:italic;font-size:clamp(1.6rem,4vw,2.6rem);color:var(--oro);height:1.3em;margin:0;transition:opacity .5s}
  .pz-saluto.via{opacity:0}
  .leg{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:1.2rem 0}
  .leg>div{border-radius:14px;padding:1rem 1.1rem}
  .leg b{display:block;font:800 .62rem var(--fu);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.5rem}
  .leg p{margin:0;font-size:.88rem;line-height:1.55}
  .leg .a{background:linear-gradient(170deg,#0e1a11,#1c2e20);color:#f5f0e8;border:1px solid rgba(237,217,138,.3)}
  .leg .a b{color:var(--oro2)}.leg .a p{font-family:var(--fd);font-style:italic;font-size:1.08rem}
  .leg .b{background:#fff;border:2px solid var(--bosco)}.leg .b b{color:var(--bosco)}
  .leg .c{background:#fffbeb;border:2px solid var(--oro)}.leg .c b{color:var(--oro)}
  .pz-cifre{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.9rem}
  .pz-cifra{background:#fff;border:1px solid var(--av3);border-radius:14px;padding:1rem .8rem;text-align:center;box-shadow:var(--sh-sm)}
  .pz-cifra b{display:block;font-family:var(--fd);font-weight:400;font-size:2.6rem;line-height:1;color:var(--bosco)}
  .pz-cifra span{display:block;margin-top:.4rem;font:700 .66rem var(--fu);letter-spacing:.07em;text-transform:uppercase;color:var(--txt2)}
  .tl{display:grid;gap:.8rem}
  .tl .bl{display:grid;grid-template-columns:78px 1fr;gap:1rem;background:#fff;border:1.5px solid var(--av3);border-radius:14px;padding:.9rem 1rem;opacity:.35;transition:opacity .8s,border-color .8s,box-shadow .8s,transform .8s}
  .tl .bl.on{opacity:1;border-color:var(--oro);box-shadow:0 10px 26px rgba(184,146,42,.22);transform:translateX(4px)}
  .tl .bl.fatto{opacity:.75}
  .tl .mm{font-family:var(--fd);font-size:2.3rem;line-height:1;color:var(--bosco);text-align:center}
  .tl .mm small{display:block;font:800 .58rem var(--fu);letter-spacing:.1em;text-transform:uppercase;color:var(--oro);margin-top:.2rem}
  .tl .rr{font-size:.88rem;line-height:1.55;color:var(--txt)}
  .tl .rr b{color:var(--bosco)}
  .tl .rr span{display:block}
  .ponte{margin-top:1rem;background:#fffbeb;border:1px solid #fde68a;border-left:4px solid var(--oro);border-radius:0 12px 12px 0;padding:.9rem 1.1rem;font-size:.9rem;line-height:1.6;color:#713f12;opacity:0;transition:opacity 1s}
  .ponte.on{opacity:1}
  .gen{display:grid;gap:1.2rem;grid-template-columns:minmax(0,1fr)}
  @media (min-width:760px){.gen{grid-template-columns:1fr 1fr}}
  label.et{display:block;font:700 .68rem var(--fu);letter-spacing:.07em;text-transform:uppercase;color:var(--bosco);margin:0 0 .3rem}
  .gen textarea,.gen input,.gen select{width:100%;font:500 .92rem var(--fu);padding:.65rem .8rem;border:1.5px solid var(--av3);border-radius:10px;background:var(--av)}
  .gen textarea{min-height:150px;line-height:1.6;resize:vertical}
  .riga{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}
  .out{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.7rem;min-height:240px;background:var(--av);border:1.5px dashed var(--av3);border-radius:14px;padding:1rem}
  .out canvas{width:190px;height:190px;image-rendering:pixelated;border-radius:8px;border:1px solid var(--av3);background:#fff}
  .out small{color:var(--txt2);font-size:.8rem;line-height:1.5;max-width:30ch}
  .stato{font:700 .74rem var(--fu);color:var(--bosco2);margin:.5rem 0 0;min-height:1.2em}.stato.no{color:#991b1b}
  .corr{display:grid;gap:1.2rem;grid-template-columns:minmax(0,1fr)}
  @media (min-width:760px){.corr{grid-template-columns:1.15fr .85fr}}
  .rg{background:#fff;border:1px solid var(--av3);border-radius:12px;padding:.75rem .9rem;margin-bottom:.6rem}
  .rg .it{display:block;font-family:var(--fd);font-size:1.2rem;color:var(--bosco);margin-bottom:.3rem}
  .rg input{width:100%;font:600 .95rem var(--fu);padding:.55rem .7rem;border:1.5px solid var(--av3);border-radius:9px;background:var(--av)}
  .dove{display:flex;flex-wrap:wrap;gap:.4rem;margin:.8rem 0 .4rem}
  .dove span{font:800 .62rem var(--fu);letter-spacing:.07em;text-transform:uppercase;padding:.35rem .65rem;border-radius:999px;background:var(--av2);color:var(--bosco2);transition:background .3s,color .3s}
  .dove span.lampo{background:var(--oro);color:#fff}
  .telm{background:#111;border-radius:26px;padding:10px;max-width:290px;margin:0 auto;box-shadow:0 18px 40px rgba(20,34,22,.25)}
  .telm>div{background:var(--av);border-radius:18px;padding:1.1rem .9rem;min-height:240px}
  .telm .dom{font:800 .58rem var(--fu);letter-spacing:.14em;text-transform:uppercase;color:var(--oro);text-align:center;margin:0 0 .3rem}
  .telm .q{font-family:var(--fd);font-size:1.25rem;color:var(--bosco);text-align:center;margin:0 0 .8rem}
  .telm .r{display:flex;align-items:center;gap:.6rem;background:#fff;border:1.5px solid #10b981;border-radius:12px;padding:.65rem .75rem;font-weight:600;font-size:.92rem;color:#065f46}
  .telm .r.n{animation:fl .8s}@keyframes fl{0%{background:#fde68a}100%{background:#fff}}
  .telm .r span{flex:1}
  .proto-top{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;background:var(--bosco);color:#fff;padding:.8rem 1.1rem;border-radius:12px 12px 0 0}
  .proto-top b{font-family:var(--fd);font-weight:400;font-size:1.25rem}
  .proto-top span{font:800 .58rem var(--fu);letter-spacing:.14em;text-transform:uppercase;background:var(--oro);padding:.3rem .6rem;border-radius:999px}
  .proto-tab{display:flex;gap:.2rem;border:1px solid var(--av3);border-top:0;overflow-x:auto;scrollbar-width:none;background:#fff}
  .proto-tab button{font:700 .72rem var(--fu);border:0;background:transparent;padding:.7rem .85rem;color:var(--txt2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  .proto-tab button[aria-selected=true]{color:var(--bosco);border-bottom-color:var(--oro)}
  .proto-corpo{background:#fff;border:1px solid var(--av3);border-top:0;border-radius:0 0 12px 12px;padding:1rem;min-height:230px}
  .el{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;border:1px solid var(--av3);border-radius:12px;padding:.7rem .9rem;margin-bottom:.55rem;background:var(--bco)}
  .el .t{flex:1;min-width:150px}.el .t b{display:block;color:var(--bosco);font-size:.92rem}.el .t small{color:var(--txt2);font-size:.74rem}
  .stat{font:800 .58rem var(--fu);letter-spacing:.08em;text-transform:uppercase;padding:.26rem .55rem;border-radius:6px}
  .stat.b{background:#fffbeb;color:#92400e}.stat.p{background:#ecfdf5;color:#047857}.stat.a{background:#eef2ff;color:#3730a3}
  .mini{font:700 .64rem var(--fu);letter-spacing:.06em;text-transform:uppercase;padding:.45rem .7rem;border-radius:8px;border:1.5px solid var(--bosco);background:transparent;color:var(--bosco);cursor:pointer}
  .mini.pieno{background:var(--bosco);color:#fff}
  .mini:disabled{opacity:.5;cursor:default}
  .proto-corpo input,.proto-corpo textarea{width:100%;font:500 .9rem var(--fu);padding:.6rem .75rem;border:1.5px solid var(--av3);border-radius:10px;background:var(--av);margin-bottom:.55rem}
  .msg{font:700 .8rem var(--fu);color:#047857;margin:.4rem 0 0;min-height:1.2em}
  .fasi{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.8rem;margin-top:1rem}
  .fase{border-radius:12px;padding:.9rem 1rem;border:1px solid var(--av3);background:#fff}
  .fase.ora{border:2px solid var(--bosco);background:linear-gradient(135deg,#fff,#eef3ee)}
  .fase h4{font:800 .62rem var(--fu);letter-spacing:.12em;text-transform:uppercase;color:var(--oro);margin:0 0 .25rem}
  .fase b{display:block;font-family:var(--fd);font-weight:400;font-size:1.1rem;color:var(--bosco);margin-bottom:.3rem}
  .fase ul{margin:0;padding-left:1.05rem;font-size:.8rem;line-height:1.65;color:var(--txt2)}
  .live{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.8rem;margin-bottom:1rem}
  .live div{background:#0e1a11;border-radius:14px;padding:.9rem;text-align:center}
  .live b{display:block;font-family:var(--fd);font-weight:400;font-size:2.2rem;color:var(--oro3);line-height:1}
  .live span{display:block;margin-top:.35rem;font:700 .6rem var(--fu);letter-spacing:.08em;text-transform:uppercase;color:rgba(245,240,232,.75)}
  .acc{border:1px solid var(--av3);border-radius:12px;margin-bottom:.5rem;background:#fff;overflow:hidden}
  .acc button{width:100%;text-align:left;background:transparent;border:0;padding:.8rem 1rem;font-family:var(--fd);font-size:1.12rem;color:var(--bosco);cursor:pointer;display:flex;justify-content:space-between;gap:1rem}
  .acc button::after{content:"+";color:var(--oro);font-weight:700}
  .acc.aperto button::after{content:"−"}
  .acc p{margin:0;padding:0 1rem;max-height:0;overflow:hidden;font-size:.9rem;color:var(--txt2);transition:max-height .4s,padding .4s}
  .acc.aperto p{max-height:200px;padding:0 1rem .9rem}
  .fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.8rem;margin:.6rem 0 1.2rem;counter-reset:s}
  .fila div{counter-increment:s;background:#fff;border:1px solid var(--av3);border-radius:12px;padding:1rem .9rem .8rem;position:relative}
  .fila div::before{content:counter(s);position:absolute;top:-12px;left:12px;width:26px;height:26px;border-radius:50%;background:var(--oro);color:#fff;font:800 .74rem var(--fu);display:flex;align-items:center;justify-content:center}
  .fila h4{font:800 .68rem var(--fu);letter-spacing:.06em;text-transform:uppercase;color:var(--bosco);margin:.2rem 0 .25rem}
  .fila p{margin:0;font-size:.82rem;line-height:1.5;color:var(--txt2)}

  .ric b{color:var(--bosco)}.ric small{display:block;margin-top:.4rem;font-size:.78rem;color:var(--txt2)}
  .chi{display:grid;gap:1.4rem;grid-template-columns:minmax(0,1fr)}
  @media (min-width:760px){.chi{grid-template-columns:1fr 1fr}}
  .chi blockquote{margin:0;font-family:var(--fd);font-size:clamp(1.3rem,2.4vw,1.8rem);line-height:1.35;color:var(--bosco);border-left:3px solid var(--oro);padding-left:1rem}

<script src="lingue/lingue.js"></script>

<script>
(function () {
  'use strict';

  function carica(src) { return new Promise(function (ok) { var s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ok; document.head.appendChild(s); }); }

  var PARTI = [
    { n: 'Il progetto' },

  var SC = [
    { p: 0, tit: 'Benvenuti', tipo: 'nat', mount: mIntro, etic: 'Come leggere questa visita', dwell: 12000, beats: [

    { p: 0, tit: 'Il punto di partenza', tipo: 'nat', mount: mNumeri, etic: 'Dati veri, contati adesso', beats: [
      { t: 'Prima i fatti. Questi numeri non sono scritti a mano: vengono contati in questo istante sui file veri del sito.' },

    { p: 1, tit: 'La porta d\'ingresso', tipo: 'sito', dev: 'tel', url: 'lingue/', beats: [

    { p: 1, tit: 'Il ristorante illustrato', tipo: 'sito', dev: 'tel', url: 'lingue/illustrato.html', beats: [

    { p: 2, tit: 'Un\'ora di lezione, minuto per minuto', tipo: 'nat', mount: mAula, etic: 'Scaletta vera della lezione «In brigata»', dwell: 7000, beats: [
      { t: 'Ora il punto che conta di più per voi: come si lavora in classe, con i ragazzi. Questa è la scaletta di una delle lezioni già pronte.' },
      { t: 'Dieci minuti alla LIM: si scorrono insieme le schede e la classe risponde alle domande lampo per alzata di mano.', fn: function () { aula(0); } },
      { t: 'Venticinque minuti sul telefono: ognuno si esercita da solo o a coppie, e chi finisce prima rifà la missione.', fn: function () { aula(1); } },

      { t: 'Dieci minuti di verifica breve, in due file, oppure la ricetta scritta come compito.', fn: function () { aula(3); } },
      { t: 'Il docente guida, i ragazzi fanno: nessuno resta spettatore. E con i docenti di cucina la ricetta si può preparare davvero in laboratorio.', fn: function () { aula(4); } }
    ] },
    { p: 2, tit: 'I giochi a squadre alla LIM', tipo: 'sito', dev: 'fin', url: 'lingue/giochi.html', beats: [
      { t: 'Alla lavagna ci sono quattro giochi a due squadre: memory, indovina la parola, traduci a tempo, ascolta e scegli.', hl: '#gc-giochi' },

      { t: 'Gli imprevisti mettono alla prova il sangue freddo: una situazione difficile con un cliente, da gestire nella sua lingua.', hl: '.im-elenco' },
      { t: 'Lo studente sceglie come rispondere e riceve subito la reazione e la spiegazione del perché.' },
      { t: 'Ottimo spunto per discutere insieme registro, cortesia e gestione del reclamo.' }
    ] },
    { p: 3, tit: 'Le vostre frasi, in un minuto', tipo: 'nat', mount: mGenera, etic: 'Provate voi: scrivete e generate', oro: true, dwell: 30000, beats: [
      { t: 'Passiamo agli strumenti per voi. Si scrivono o si incollano le frasi della lezione, anche da Word o da Excel.' },
      { t: 'Con un clic nasce un link con un codice QR da dare ai ragazzi: inquadrano, e l\'esercizio si apre sul loro telefono.' },
      { t: 'Provateci: il generatore qui accanto è vero. Le stesse frasi si possono giocare anche alla LIM.' }

    { p: 3, tit: 'La lezione in 5 minuti', tipo: 'sito', dev: 'fin', url: 'lingue/cinque-minuti.html', beats: [
      { t: 'Se serve una lezione completa su un argomento nuovo, il sito prepara la richiesta per un\'intelligenza artificiale gratuita.' },

    { p: 3, tit: 'Verifiche in un clic', tipo: 'sito', dev: 'fin', url: 'lingue/verifiche.html', beats: [

      { t: 'Un sito di lingue vale quanto le sue frasi. E le frasi, per essere giuste, hanno bisogno di chi la lingua la insegna.' },

    { p: 3, tit: 'L\'area docenti', tipo: 'nat', mount: mProto, etic: 'Prototipo da provare, non ancora attivo', oro: true, dwell: 30000, beats: [

      { t: 'Un software comprato cambia quando arriva l\'aggiornamento. Questo cambia con voi: dite cosa manca, lo si costruisce, lo si prova insieme.' },

    { p: 4, tit: 'Cosa chiedo al Dipartimento', tipo: 'nat', mount: mChiusura, etic: 'Scheda da compilare in riunione', oro: true, dwell: 0, beats: [

  ];

  var cur = -1, timers = [], auto = false, ifr = null, pronto = false, coda = [];
  var prog = $('prog'), palco = $('palco'), gin = $('g-in'), guida = $('guida');
  prog.innerHTML = SC.map(function (s, i) { return '<i data-i="' + i + '"' + (PARTI[s.p].cuore ? ' class="cuore"' : '') + ' title="' + esc(s.tit) + '"></i>'; }).join('');
  function pulisciTimer() { timers.forEach(clearTimeout); timers = []; }
  function dopo(f, ms) { var t = setTimeout(f, ms); timers.push(t); return t; }

  function indice() {
    var h = '<h2>Indice della visita</h2>', last = -1;
    SC.forEach(function (s, i) {
      if (s.p !== last) { last = s.p; h += '<h3' + (PARTI[s.p].cuore ? ' class="cuore"' : '') + '>Parte ' + (s.p + 1) + ' · ' + esc(PARTI[s.p].n) + (PARTI[s.p].cuore ? ' · il cuore del progetto' : '') + '</h3>'; }

  function vai(i) {
    if (i < 0 || i >= SC.length) return;
    pulisciTimer(); coda = []; pronto = false; cur = i;
    var s = SC[i];
    [].forEach.call(prog.children, function (e, k) { e.className = (PARTI[SC[k].p].cuore ? 'cuore ' : '') + (k < i ? 'fatto' : k === i ? 'ora' : ''); });
    $('b-n').textContent = (i + 1) + ' / ' + SC.length;
    $('ti').textContent = 'Parte ' + (s.p + 1) + ' · ' + PARTI[s.p].n;
    $('b-ind-p').disabled = i === 0;
    var av = $('b-av'); av.classList.remove('pronto'); av.textContent = i === SC.length - 1 ? 'Fine ✓' : 'Avanti ›'; av.disabled = i === SC.length - 1;
    guida.scrollTop = 0; guida.classList.remove('ferma');
    gin.innerHTML = '<div class="g-etichetta"><span class="g-onda"><i></i><i></i><i></i><i></i></span>La voce che spiega</div>' +
      '<p class="g-parte' + (PARTI[s.p].cuore ? ' cuore' : '') + '">' + (PARTI[s.p].cuore ? '★ ' : '') + 'Parte ' + (s.p + 1) + ' · ' + esc(PARTI[s.p].n) + '</p>' +
      '<h2 class="g-tit" id="g-tit">' + esc(s.tit) + '</h2><div id="g-bb"></div>';
    palco.className = 'palco'; palco.innerHTML = ''; ifr = null;
    void palco.offsetWidth; palco.classList.add('entra');
    var avvio = function () { dopo(function () { $('g-tit').classList.add('on'); }, 150); dopo(function () { battute(s, 0); }, 1500); };
    if (s.tipo === 'sito') montaSito(s, avvio); else { montaNat(s); avvio(); }
    try { history.replaceState(null, '', location.pathname + '#s' + (i + 1)); } catch (e) {}
  }

  function battute(s, k) {
    if (SC[cur] !== s) return;
    if (k >= s.beats.length) { fine(s); return; }
    var b = s.beats[k], bb = $('g-bb');
    [].forEach.call(bb.children, function (e) { e.classList.remove('ultimo'); e.classList.add('vecchio'); });
    var p = document.createElement('p'); p.className = 'g-b'; p.textContent = b.t; bb.appendChild(p);
    void p.offsetWidth; p.classList.add('on', 'ultimo');
    guida.scrollTo({ top: guida.scrollHeight, behavior: ridotto ? 'auto' : 'smooth' });
    azione(b); if (b.fn) b.fn(s);
    dopo(function () { battute(s, k + 1); }, 1700 + b.t.length * 48);
  }
  function fine(s) {
    guida.classList.add('ferma');
    if (cur < SC.length - 1) $('b-av').classList.add('pronto');
    if (auto && cur < SC.length - 1) dopo(function () { if (auto) vai(cur + 1); }, s.dwell != null ? s.dwell : 3800);
  }

  var CSS_IN = '#hdr,.lg-anteprima,#fab-wrap,#tr-btn,.sec-nav-arrow{display:none!important} body{padding-top:0!important}' +
    '.pz-hl{outline:3px solid #D4AA4A!important;outline-offset:5px!important;border-radius:14px;box-shadow:0 0 0 9999px rgba(10,20,12,.38)!important;position:relative!important;z-index:60!important;animation:pzh 1.6s ease-in-out infinite}' +
    '@keyframes pzh{50%{outline-color:#fff}}';
  function montaSito(s, quando) {
    var tel = s.dev === 'tel', url = location.host + '/' + s.url.replace(/^\//, '');

      (tel ? '<div class="tel"><div class="sc" id="pz-sc"></div></div>' : '<div class="fin"><span class="url">' + esc(url) + '</span><div class="sc" id="pz-sc"></div></div>');
    var fr = document.createElement('iframe'); fr.title = s.tit; ifr = fr; var fatto = false;
    function ok() {
      if (fatto) return; fatto = true;
      try { var d = fr.contentDocument, st = d.createElement('style'); st.textContent = CSS_IN; d.head.appendChild(st); } catch (e) {}
      pronto = true; var c = coda; coda = []; c.forEach(azione); quando();
    }
    fr.addEventListener('load', ok); dopo(ok, 6000);
    fr.src = s.url; $('pz-sc').appendChild(fr);
  }
  function trova(d, sel, tent, cb) {
    var el = null; try { el = d.querySelector(sel); } catch (e) {}
    if (el || tent <= 0) { cb(el); return; }
    dopo(function () { trova(d, sel, tent - 1, cb); }, 400);
  }
  function azione(b) {
    if (!b.hl && !b.click) return;
    if (!ifr) return;
    if (!pronto) { coda.push(b); return; }
    var d; try { d = ifr.contentDocument; } catch (e) { return; }
    if (!d || !d.body) return;
    [].forEach.call(d.querySelectorAll('.pz-hl'), function (e) { e.classList.remove('pz-hl'); });
    if (b.hl) trova(d, b.hl, 6, function (el) { if (!el) return; el.classList.add('pz-hl'); try { el.scrollIntoView({ block: 'center', behavior: ridotto ? 'auto' : 'smooth' }); } catch (e) {} });
    if (b.click) dopo(function () { trova(d, b.click, 4, function (el) { if (el) try { el.click(); } catch (e) {} }); }, b.hl ? 1300 : 300);
  }

  function montaNat(s) {
    palco.innerHTML = '<span class="etic' + (s.oro ? ' oro' : '') + '">' + (s.oro ? '✋ ' : '<span class="p"></span>') + esc(s.etic || '') + '</span><div class="nat' + (s.oro ? ' oro' : '') + '" id="nat"></div>';
    s.mount($('nat'));
  }

  function mIntro(el) {
    el.innerHTML = '<p class="pz-saluto" id="pz-saluto" aria-hidden="true">Welcome</p><h3 style="font-size:2.2rem;margin-top:.2rem">Le lingue dell\'Alberghiero</h3>' +
      '<p class="nota" style="font-size:.95rem">Presentazione per il Dipartimento di Lingue · a cura dell\'Educatore Michele Gaggiano</p>' +
      '<p style="margin:1.1rem 0 .2rem"><b>In questa visita ci sono tre tipi di schermo:</b></p>' +
      '<div class="leg"><div class="a"><b>La voce che spiega</b><p>Testo bianco su fondo scuro, che appare lentamente. È la spiegazione.</p></div>' +
      '<div class="b"><b>● Il sito vero, dal vivo</b><p>Cornice chiara con il pallino verde. Sono le pagine reali, come le vedono gli studenti.</p></div>' +
      '<div class="c"><b>✋ Provate voi</b><p>Cornice dorata. Si può scrivere, cliccare, giocare.</p></div></div>' +
      '<div class="riga"><button type="button" class="lg-btn pieno" id="i-auto">▶ Avvia la visita automatica</button><button type="button" class="lg-btn" id="i-man">Preferisco andare avanti io</button></div>' +
      '<p class="nota" style="margin-top:1rem">Con le frecce della tastiera ci si sposta tra le scene; «Indice» permette di saltare a quella che interessa.</p>';
    var SAL = ['Welcome', 'Bienvenue', 'Bienvenidos', 'Willkommen', 'Benvenuti'], i = 0, e = $('pz-saluto');

      '<li><b>Il precedente</b>Il sito istituzionale del Convitto, con oltre settanta pagine, è stato realizzato con lo stesso criterio: strumenti gratuiti, nessun costo per l\'Istituto, attenzione a sicurezza e privacy.</li>' +
      '<li><b>L\'impegno</b>Lavoro trasparente: ogni scelta si può discutere, ogni errore si corregge, ogni contenuto resta controllabile da chi ne è competente.</li></ul></div>';
  }

  var SCHEDA = '<h4>Scheda di riscontro del Dipartimento di Lingue</h4><p>Lingua e docente</p><div class="linea"></div><p>Per prima cosa vorrei (anche più di una)</p>' +
    '<label><input type="checkbox"/> Un archivio personale dei miei esercizi</label><label><input type="checkbox"/> Correggere le frasi del vocabolario nella mia lingua</label><label><input type="checkbox"/> Lezioni guidate nella mia lingua</label><label><input type="checkbox"/> Proporre risorse e siti per gli studenti</label><label><input type="checkbox"/> Altro: ______________________________</label>' +
    '<p>Ho trovato da correggere</p><div class="linea"></div><div class="linea"></div><p>Nel mio indirizzo servirebbero</p><div class="linea"></div><div class="linea"></div>';
  function mChiusura(el) {
    el.innerHTML = '<div class="chiedo"><div><i>1</i><h4>Controllare le frasi</h4><p>Ogni docente rilegge le sezioni della propria lingua e segnala cosa correggere.</p></div><div><i>2</i><h4>Dire cosa manca</h4><p>Per ogni indirizzo: quali situazioni, parole e dialoghi servono davvero in classe e in stage.</p></div><div><i>3</i><h4>Scegliere la prossima funzione</h4><p>Dell\'area docenti, quale vorreste per prima?</p></div></div>' +
      '<div class="scheda">' + SCHEDA + '</div><div class="riga"><button type="button" class="lg-btn pieno" id="z-stampa">🖨️ Stampa la scheda</button><a class="lg-btn" href="lingue/">Esplora il minisito</a><a class="lg-btn" href="lingue/docenti.html">Strumenti per i docenti</a></div>';
    $('z-stampa').addEventListener('click', function () {
      $('pz-print').innerHTML = '<div class="scheda">' + SCHEDA + '</div>'; document.body.classList.add('pz-stampa');
      var f = function () { document.body.classList.remove('pz-stampa'); window.removeEventListener('afterprint', f); }; window.addEventListener('afterprint', f); window.print();
    });
  }

  function impostaAuto(v) {
    auto = v; var b = $('b-auto'); b.setAttribute('aria-pressed', String(v)); b.textContent = v ? '⏸ Automatica' : '▶ Automatica';
    if (v && guida.classList.contains('ferma') && cur < SC.length - 1) { pulisciTimer(); dopo(function () { if (auto) vai(cur + 1); }, 1200); }
  }
  $('b-auto').addEventListener('click', function () { impostaAuto(!auto); });
  $('b-av').addEventListener('click', function () { impostaAuto(false); vai(cur + 1); });
  $('b-ind-p').addEventListener('click', function () { impostaAuto(false); vai(cur - 1); });
  prog.addEventListener('click', function (e) { var i = e.target.closest('i[data-i]'); if (i) { impostaAuto(false); vai(+i.dataset.i); } });
  $('b-ind').addEventListener('click', function () { indice(); $('ind').classList.add('aperto'); });
  $('ind-x').addEventListener('click', function () { $('ind').classList.remove('aperto'); });
  $('ind-w').addEventListener('click', function (e) { var a = e.target.closest('a[data-i]'); if (!a) return; e.preventDefault(); $('ind').classList.remove('aperto'); impostaAuto(false); vai(+a.dataset.i); });
  $('b-fs').addEventListener('click', function () { var d = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (d.requestFullscreen) d.requestFullscreen().catch(function () {}); });
  document.addEventListener('keydown', function (e) {
    if (/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) return;
    if (e.key === 'Escape') { $('ind').classList.remove('aperto'); return; }
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { impostaAuto(false); vai(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { impostaAuto(false); vai(cur - 1); }
  });
  var h = parseInt((location.hash || '').replace('#s', ''), 10);
  vai(h >= 1 && h <= SC.length ? h - 1 : 0);
})();
</script>
