<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <base href="/"/>
  <meta name="robots" content="noindex"/>
  <title>Lezione – Sala studio | Convitto "Costaggini" — Rieti</title>
  <meta name="description" content="Una lezione interattiva della Sala studio del Convitto: idee chiave, mnemotecniche, esercizi e flashcard, dal telefono e senza registrarsi."/>
  <meta name="theme-color" content="#2C3E2D"/>
  <link rel="stylesheet" href="fonts.css"/>
  <link rel="stylesheet" href="style.min.css"/>
  <link rel="stylesheet" href="studio/studio.css"/>
  <link rel="icon" href="favicon.ico" sizes="any"/>
  <script src="app.js" defer></script>
</head>
<body data-page="studio">
<div class="st-anteprima">Sala studio del Convitto · lezioni interattive</div>
<script src="nav-header.min.js"></script>
<main id="main">
  <section class="st-hero">
    <div class="w">
      <p class="lbl" id="st-mat">Sala studio</p>
      <h1 id="st-tit">Un momento…</h1>
      <p id="st-sot">Sto preparando la lezione.</p>
      <span class="st-badge" id="st-cod" hidden></span>
    </div>
  </section>
  <div id="st-modi"></div>
  <div id="st-app"></div>
</main>
<script src="nav.min.js"></script>
<script src="supabase.js"></script>
<script src="lingue/pacchetto.js"></script>
<script src="lingue/finestra.js"></script>
<script src="studio/studio.js"></script>
<script src="studio/formati.js"></script>
<script src="studio/demo.js"></script>
<script>
(function () {
  var esc = STUDIO.esc, $ = function (id) { return document.getElementById(id); };
  function errore(tit, t) {
    $('st-tit').textContent = tit; $('st-sot').textContent = t;
    $('st-app').innerHTML = '<div class="st-palco st"><div class="st-card st-avviso"><p style="margin:0">' + esc(t) + '</p><div class="st-azioni"><a class="st-btn pieno" href="studio/lezione.html?c=DEMO">Prova la lezione di esempio</a><a class="st-btn" href="studio/">Sala studio</a></div></div></div>';
  }
  function mostra(L, id) {
    document.title = L.titolo + ' – Sala studio | Convitto "Costaggini"';
    $('st-mat').textContent = L.materia || 'Sala studio';
    $('st-tit').innerHTML = '<span class="ic" aria-hidden="true">' + esc(L.icona || '📚') + '</span>' + esc(L.titolo);
    $('st-sot').textContent = L.sottotitolo || '';
    if (id && id !== 'DEMO' && id.length === 6) { $('st-cod').hidden = false; $('st-cod').textContent = 'Codice ' + id; }
    modi(L, id);
  }
  /* «Come vuoi studiare?»: la stessa lezione in quattro modi (?m= nel link) */
  var MODI = [
    ['percorso', '🧭', 'Percorso guidato', '7 tappe, da solo'],
    ['escape', '🔐', 'Escape room', 'apri i lucchetti'],
    ['mappa', '🗺️', 'Costruisci la mappa', 'ogni idea al suo posto'],
    ['squadre', '🏆', 'Sfida a squadre', 'alla LIM, con la classe']
  ];
  function modi(L, id) {
    var q = new URLSearchParams(location.search), m = q.get('m');
    if (!MODI.some(function (x) { return x[0] === m; })) m = 'percorso';
    $('st-modi').innerHTML = '<nav class="fm-modi st" aria-label="Come vuoi studiare?"><p class="fm-modi-t">Come vuoi studiare?</p><div class="fm-modi-r">' + MODI.map(function (x) {
      return '<button type="button" data-m="' + x[0] + '" aria-pressed="' + (x[0] === m) + '"><span class="ic" aria-hidden="true">' + x[1] + '</span><b>' + x[2] + '</b><small>' + x[3] + '</small></button>';
    }).join('') + '</div></nav>';
    function apri(m) {
      STUDIO.zitto();
      /* un contenitore nuovo a ogni cambio: nessun resto del modo di prima */
      var vecchio = $('st-app'), nuovo = document.createElement('div'); nuovo.id = 'st-app'; vecchio.parentNode.replaceChild(nuovo, vecchio);
      $('st-modi').querySelectorAll('[data-m]').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-m') === m); });
      if (m === 'percorso') STUDIO.avvia(L, nuovo, { id: id });
      else { nuovo.classList.add('st'); window.FORMATI[m](L, nuovo); }
    }
    $('st-modi').addEventListener('click', function (e) {
      var b = e.target.closest('[data-m]'); if (!b) return;
      var m2 = b.getAttribute('data-m'), u = new URL(location.href);
      if (m2 === 'percorso') u.searchParams.delete('m'); else u.searchParams.set('m', m2);
      history.replaceState(null, '', u);
      apri(m2);
      $('st-modi').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    apri(m);
  }
  window.addEventListener('hashchange', function () { location.reload(); });
  var q = new URLSearchParams(location.search), c = (q.get('c') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  var h = location.hash.match(/[#&]l=([A-Za-z0-9_-]+)/);
  if (c === 'DEMO') return mostra(window.STUDIO_DEMO, 'DEMO');
  if (h) return window.PACCHETTO.decodifica(h[1]).then(function (L) { if (!L || !L.titolo || !Array.isArray(L.concetti)) throw 0; mostra(L, 'link-' + h[1].slice(-12)); })
    .catch(function () { errore('Lezione non trovata', 'Il link è incompleto: forse è stato copiato solo in parte. Chiedi all\'educatore di mandarlo di nuovo.'); });
  if (!/^[A-Z2-9]{6}$/.test(c)) return errore('Quale lezione?', 'Inquadra il codice QR che trovi in sala studio, oppure scrivi il codice di 6 lettere nella pagina della Sala studio.');
  fetch(SUPABASE_URL + '/rest/v1/rpc/studio_lezione', {
    method: 'POST', headers: { 'apikey': SUPABASE_PUB, 'Authorization': 'Bearer ' + SUPABASE_PUB, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_codice: c })
  }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (L) {
    if (!L || !L.titolo) return errore('Lezione non trovata', 'Il codice ' + c + ' non corrisponde a nessuna lezione. Controlla le lettere o inquadra di nuovo il QR.');
    mostra(L, c);
  }).catch(function () { errore('Connessione assente', 'Non riesco a scaricare la lezione. Controlla la connessione e ricarica la pagina.'); });
})();
</script>
</body>
</html>
