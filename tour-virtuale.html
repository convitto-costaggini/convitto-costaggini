-radius:50%;background:rgba(184,146,42,.14);border:1.5px solid rgba(184,146,42,.5);color:var(--oro3);font-size:1.05rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s}.tv-narr-btn:hover{background:rgba(184,146,42,.28)}.tv-narr-btn[aria-pressed=true]{background:var(--oro);border-color:var(--oro);color:#1a1a1a}.tv-narr-body{flex:1;min-width:0}.tv-narr-caption{font-family:var(--fu);font-size:.78rem;line-height:1.65;color:rgba(245,240,232,.75);font-style:italic;min-height:1.4em}.tv-narr-caption.speaking{color:#fff}.tv-narr-toggle{margin-top:.35rem;background:0 0;border:0;cursor:pointer;font-family:var(--fu);font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(245,240,232,.4);padding:0;text-decoration:underline;text-underline-offset:2px}.tv-narr-toggle:hover{color:var(--oro2)}.tv-narr-unavailable{font-size:.7rem;color:rgba(245,240,232,.35);font-style:italic}</style>

<script>
// ══ STANZE ═══════════════════════════════════════════
const ROOMS = [
  { id:'ingresso',         label:'Ingresso',         icon:'🚪', title:'L\'<em>ingresso</em> del Convitto',    desc:'Il primo spazio che ogni convittore attraversa. Accogliente, luminoso, punto di incontro tra il dentro e il fuori.', img:'img/tour/ingresso.webp', thumb:'img/tour/ingresso-thumb.webp' },
  { id:'corridoi',         label:'Corridoi',          icon:'🏛️', title:'I <em>corridoi</em>',                  desc:'La spina dorsale del Convitto. I luoghi dove si incrociano migliaia di storie — di mattina di corsa, di sera con calma.', img:'img/tour/corridoi.webp', thumb:'img/tour/corridoi-thumb.webp' },
  { id:'sala-ricreativa',  label:'Sala ricreativa',   icon:'🎮', title:'La <em>sala ricreativa</em>',          desc:'Calciobalilla, ping pong, divani e vetrate sul verde. Lo spazio del gioco, del relax e dello stare insieme dopo lo studio.', img:'img/tour/sala-ricreativa.webp', thumb:'img/tour/sala-ricreativa-thumb.webp' },
  { id:'ufficio-educatori',label:'Ufficio educatori', icon:'🖥️', title:'L\'<em>ufficio educatori</em>',        desc:'Il cuore operativo del Convitto. Da qui gli educatori coordinano le attività e — nelle giornate limpide — ammirano la splendida natura che circonda la struttura: dai piani, si può fruire di una splendida vista sul Terminillo.', img:'img/tour/ufficio-educatori.webp', thumb:'img/tour/ufficio-educatori-thumb.webp' },
  { id:'camera',           label:'Camera tipo',       icon:'🛏️', title:'Una <em>camera tipo</em>',             desc:'Spazio personale, sicuro e ordinato. Ogni convittore ha il suo posto — un angolo tutto suo.', img:'img/tour/camera.webp', thumb:'img/tour/camera-thumb.webp' },
  { id:'mensa',            label:'Mensa',             icon:'🍽️', title:'La <em>mensa</em>',                    desc:'Ogni giorno, un menù cucinato internamente e concordato con lo specialista. Un luogo di convivialità vera.', img:'img/tour/mensa.jpg', thumb:'img/tour/mensa.jpg' },
  { id:'studio',           label:'Sala studio',       icon:'📖', title:'La <em>sala studio</em>',              desc:'Dalle 15:30 alle 17:15, studio guidato con gli educatori. Un ambiente silenzioso e strutturato.', img:'img/tour/studio.webp', thumb:'img/tour/studio-thumb.webp' },
  { id:'musica',           label:'Lab Musicale',      icon:'🎵', title:'Il <em>Laboratorio Musicale</em>',     desc:'Fondato da Michele Gaggiano e Dino Barba. Chitarre, tastiere, percussioni — e la libertà di scoprire un talento.', img:'img/tour/musica.jpg', thumb:'img/tour/musica.jpg' },
  { id:'infermeria',       label:'Infermeria',        icon:'🩺', title:'L\'<em>infermeria</em>',               desc:'Presidiata ogni giorno da un\'infermiera professionale: un piccolo spazio di cura e di ascolto, dove si seguono le terapie quotidiane e il benessere di ciascun convittore, anche grazie al sostegno dello sportello psicologico d\'Istituto (C.I.C.), in stretto contatto con il medico convenzionato.', img:'img/tour/infermeria.webp', thumb:'img/tour/infermeria-thumb.webp' },
  { id:'esterni',          label:'Esterni',           icon:'🌳', title:'Gli <em>esterni</em> della struttura', desc:'Il lato ovest dell\'edificio, la nuova palestra in costruzione e il verde che circonda il Convitto: un contesto tranquillo, a pochi minuti dal centro di Rieti.', img:'img/tour/esterni.webp', thumb:'img/tour/esterni-thumb.webp' },
];
const NARRATIONS = {
  'ingresso': 'Benvenuti al Convitto! Qui alla reception troverete sempre qualcuno pronto ad accogliervi: è il primo punto di riferimento, sia per chi arriva per la prima volta sia per noi ogni giorno. Da qui si accede a tutti gli ambienti: aule, sale comuni, e naturalmente le camere dei convittori e convittrici. Vi accompagno a scoprirli.',
  'corridoi': 'Questi sono i corridoi che i ragazzi percorrono ogni giorno per raggiungere le loro stanze. Non è solo un passaggio: è dove ci si incrocia, ci si saluta, si organizza la giornata al volo tra un momento e l\'altro nel flusso della nostra giornata. Le scale e l\'ascensore collegano tutti i piani della struttura.',
  'sala-ricreativa': 'Questa è la sala ricreativa, uno dei posti preferiti dai nostri giovani. Calcio balilla, ping pong, un po\' di relax dopo lo studio: qui si respira un\'atmosfera diversa, più leggera. E quando il tempo lo permette, la porta si apre direttamente sul verde esterno.',
  'ufficio-educatori': 'Questo è l\'ufficio degli educatori, il punto di riferimento per qualsiasi cosa: un dubbio, un problema, o semplicemente due chiacchiere. Sono sempre presenti, giorno e notte, ed è rassicurante per tutti sapere che c\'è sempre qualcuno a cui rivolgersi.',
  /* Bozze nuove — stesso tono delle 4 sopra, ricavate dalla "desc" già presente in ROOMS. Da rileggere e correggere prima di considerarle definitive: mensa e musica. Camera e sala studio confermate (foto reali). Infermeria ed esterni riviste il 9/9 su richiesta esplicita di Michele. */
  'camera': 'Questa è una camera tipo: uno spazio personale, sicuro e ordinato. Ogni convittore ha il suo posto, un angolo tutto suo dove sistemare le proprie cose.',
  'mensa': 'Questa è la mensa. Ogni giorno viene preparato un menù cucinato internamente e concordato con lo specialista: più che un pasto, un momento di convivialità vera.',
  'studio': 'Questa è la sala studio. Dalle 15:30 alle 17:15 c\'è lo studio guidato con gli educatori, in un ambiente silenzioso e strutturato, pensato per concentrarsi davvero.',
  'musica': 'Questo è il Laboratorio Musicale, fondato da Michele Gaggiano e Dino Barba. Chitarre, tastiere, percussioni — e la libertà di scoprire un talento che magari non sapevi di avere.',
  'infermeria': 'Questa è l\'infermeria, presidiata ogni giorno da un\'infermiera professionale: uno spazio di cura e di ascolto, dove si seguono le terapie quotidiane e il benessere di ognuno di noi. Anche il sostegno psicologico, attraverso lo sportello del Centro di Informazione e Consulenza, trova qui il suo punto di riferimento, sempre in contatto con il medico convenzionato.',
  'esterni': 'Ecco gli esterni della struttura: il lato ovest dell\'edificio convittuale, la nuova palestra in costruzione qui di fronte, e tutto il verde che ci circonda. Pur essendo a pochi minuti dal centro di Rieti, l\'ambiente è tranquillo, quasi immerso nella natura.',
};
// Percorsi per eventuali registrazioni con voce umana, quando saranno disponibili e autorizzate.
const AUDIO_SRC = {
  'ingresso':          'audio/tour/ingresso.mp3',
  'corridoi':          'audio/tour/corridoi.mp3',
  'sala-ricreativa':   'audio/tour/sala-ricreativa.mp3',
  'ufficio-educatori': 'audio/tour/ufficio-educatori.mp3',
  'camera':            'audio/tour/camera.mp3',
  'mensa':             'audio/tour/mensa.mp3',
  'studio':            'audio/tour/studio.mp3',
  'musica':            'audio/tour/musica.mp3',
  'infermeria':        'audio/tour/infermeria.mp3',
  'esterni':           'audio/tour/esterni.mp3',
};
// Stanze per cui la registrazione con voce umana in AUDIO_SRC è realmente presente e autorizzata.
// Oggi è vuoto (nessuna registrazione esiste ancora): si parla sempre con la voce sintetica.
// Quando un mp3 sarà pronto, basta aggiungere qui l'id della stanza corrispondente — verrà
// preferito automaticamente alla sintesi, senza altre modifiche al codice.
const AUDIO_PRONTO = new Set([]);
// ══ THREE.JS VIEWER ═══════════════════════════════════
const canvas   = document.getElementById('tv-canvas');
const wrap     = canvas.closest('.tv-viewer-wrap');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(70, 1, 0.1, 1000); // FOV verticale: ricalcolato in resize() da H_FOV orizzontale
camera.position.set(0, 0, 0.01);
// Sfera interna
const geometry = new THREE.SphereGeometry(500, 60, 40);
geometry.scale(-1, 1, 1); // invertita — la texture è vista dall'interno
const material = new THREE.MeshBasicMaterial({ color: 0x111111 });
const sphere   = new THREE.Mesh(geometry, material);
scene.add(sphere);
const loader   = new THREE.TextureLoader();
let raf        = null;
let autoRot    = true;
let isDragging = false;
let lastX = 0, lastY = 0;
let lon = 0, lat = 0;   // angolo di visione corrente
let autoTimer  = null;
const DEFAULT_HFOV = 75; // campo visivo orizzontale di partenza per ogni ambiente
let H_FOV = DEFAULT_HFOV;
const FOV_MIN = 55, FOV_MAX = 100;
function applyFov() {
  const hfov = THREE.MathUtils.degToRad(H_FOV);
  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(hfov / 2) / camera.aspect));
  camera.updateProjectionMatrix();
}
function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); // nitidezza su schermi HiDPI/retina
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  applyFov();
}
function zoom(delta) {
  H_FOV = Math.max(FOV_MIN, Math.min(FOV_MAX, H_FOV + delta));
  applyFov();
}
function render() {
  // Autorotazione
  if (autoRot && !isDragging) lon += 0.04;
  lat = Math.max(-85, Math.min(85, lat));
  const phi   = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  camera.lookAt(
    500 * Math.sin(phi) * Math.cos(theta),
    500 * Math.cos(phi),
    500 * Math.sin(phi) * Math.sin(theta)
  );
  renderer.render(scene, camera);
  raf = requestAnimationFrame(render);
}
// ── Carica immagine ──
function loadPanorama(src) {
  material.map = null; material.needsUpdate = true;
  loader.load(src, function(tex) {
    tex.minFilter = THREE.LinearFilter;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); // texture nitida anche guardando le pareti di sbieco
    material.map  = tex;
    material.color.set(0xffffff);
    material.needsUpdate = true;
    document.getElementById('tv-placeholder').style.display = 'none';
    document.getElementById('tv-info').style.display = 'block';
  }, undefined, function() {
    // Immagine non trovata → mostra placeholder
    document.getElementById('tv-placeholder').style.display = 'flex';
    document.getElementById('tv-info').style.display = 'block';
  });
}
// ── Drag mouse ──
canvas.addEventListener('mousedown', e => {
  isDragging = true; lastX = e.clientX; lastY = e.clientY;
  autoRot = false; clearTimeout(autoTimer);
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  autoTimer = setTimeout(() => { autoRot = true; }, 2000);
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  lon -= (e.clientX - lastX) * 0.2;
  lat += (e.clientY - lastY) * 0.2;
  lastX = e.clientX; lastY = e.clientY;
});
// ── Drag touch ──
let t0 = null;
canvas.addEventListener('touchstart', e => {
  t0 = e.touches[0]; isDragging = true;
  autoRot = false; clearTimeout(autoTimer);
}, { passive: true });
canvas.addEventListener('touchend', () => {
  isDragging = false;
  autoTimer = setTimeout(() => { autoRot = true; }, 2000);
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (!isDragging || !t0) return;
  const t = e.touches[0];
  lon -= (t.clientX - t0.clientX) * 0.2;
  lat += (t.clientY - t0.clientY) * 0.2;
  t0 = t;
}, { passive: true });
// ── Pulsanti freccia ──
const PAN_SPEED = 3;
const panMap = {
  'btn-up':    () => { lat += PAN_SPEED; },
  'btn-down':  () => { lat -= PAN_SPEED; },
  'btn-left':  () => { lon -= PAN_SPEED; },
  'btn-right': () => { lon += PAN_SPEED; },
};
let panInterval = null;
Object.entries(panMap).forEach(([id, fn]) => {
  const btn = document.getElementById(id);
  const start = () => { autoRot = false; clearTimeout(autoTimer); fn(); panInterval = setInterval(fn, 60); };
  const stop  = () => { clearInterval(panInterval); autoTimer = setTimeout(() => { autoRot = true; }, 2000); };
  btn.addEventListener('mousedown',  start);
  btn.addEventListener('touchstart', start, { passive: true });
  btn.addEventListener('mouseup',    stop);
  btn.addEventListener('touchend',   stop, { passive: true });
  btn.addEventListener('mouseleave', stop);
});
// ── Zoom (allontana/avvicina) ──
document.getElementById('btn-zoom-out').addEventListener('click', () => { autoRot = false; clearTimeout(autoTimer); zoom(+6); autoTimer = setTimeout(() => { autoRot = true; }, 2000); });
document.getElementById('btn-zoom-in').addEventListener('click',  () => { autoRot = false; clearTimeout(autoTimer); zoom(-6); autoTimer = setTimeout(() => { autoRot = true; }, 2000); });
let ccEnabled = localStorage.getItem('tv-cc-enabled') !== 'off'; // sottotitoli attivi di default
const narrAudio = new Audio();
narrAudio.preload = 'none';
const narrBar    = document.getElementById('tv-narration');
const narrBtn    = document.getElementById('tv-narr-btn');
const narrCap    = document.getElementById('tv-narr-caption');
const ccToggle   = document.getElementById('tv-narr-cc-toggle');
function updateNarrBtn(speaking) {
  narrBtn.textContent = speaking ? '⏸' : '🔊';
  narrBtn.setAttribute('aria-pressed', String(speaking));
  narrBtn.setAttribute('aria-label', speaking ? 'Metti in pausa la guida vocale' : 'Ascolta la guida vocale');
  narrCap.classList.toggle('speaking', speaking);
}
// ══ VOCE SINTETICA (Web Speech API) ═══════════════════
// Nessuna registrazione, nessuna autorizzazione da attendere: parla il browser
// stesso. Qualche accorgimento per renderla meno "robotica":
//  1) sceglie, tra le voci italiane disponibili, quella di qualità migliore
//     (le voci "cloud" dei vari sistemi suonano quasi sempre meglio di quelle
//     locali di scorta);
//  2) legge una frase alla volta invece dell'intero paragrafo in un fiato solo,
//     con una breve pausa tra una frase e l'altra — è il trucco che aiuta di più
//     a farla sembrare meno artificiale;
//  3) velocità leggermente ridotta e intonazione appena addolcita.
let ttsVoice = null;
function pickBestItalianVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  if (!voices.length) return null;
  const it = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('it'));
  const pool = it.length ? it : voices;
  // Nomi che, sui vari sistemi operativi/browser, corrispondono di solito a voci
  // "naturali"/cloud più gradevoli di quelle robotiche di default.
  const preferite = ['google italiano', 'elsa', 'isabella', 'diego', 'cosimo', 'alice', 'federica', 'luca', 'paola'];
  for (const nome of preferite) {
    const m = pool.find(v => v.name.toLowerCase().includes(nome));
    if (m) return m;
  }
  const cloud = pool.find(v => v.localService === false); // spesso di qualità migliore delle voci locali
  return cloud || pool[0];
}
if ('speechSynthesis' in window) {
  ttsVoice = pickBestItalianVoice();
  speechSynthesis.addEventListener('voiceschanged', () => { ttsVoice = pickBestItalianVoice(); });
}
let narrSession = 0;   // invalida i callback asincroni di una lettura precedente quando si cambia stanza
let usingSynthesis = false;
function splitSentences(text) {
  return (text.match(/[^.!?]+[.!?]*/g) || [text]).map(s => s.trim()).filter(Boolean);
}
function speakSynthetic(room, session) {
  if (!('speechSynthesis' in window)) {
    narrBtn.style.display = 'none';
    if (!ccEnabled) narrCap.textContent = NARRATIONS[room.id] || '';
    return;
  }
  usingSynthesis = true;
  narrBtn.style.display = 'flex';
  const queue = splitSentences(NARRATIONS[room.id] || '');
  let i = 0;
  function next() {
    if (session !== narrSession) return; // si è cambiata stanza nel frattempo
    if (i >= queue.length) { updateNarrBtn(false); return; }
    const frase = queue[i];
    const u = new SpeechSynthesisUtterance(frase);
    u.lang = 'it-IT';
    if (ttsVoice) u.voice = ttsVoice;
    u.rate = 0.94;
    u.pitch = 1.03;
    u.onstart = () => { if (session === narrSession) { updateNarrBtn(true); if (ccEnabled) narrCap.textContent = frase; } };
    u.onend   = () => { if (session === narrSession) { i++; setTimeout(next, 280); } };
    u.onerror = () => { if (session === narrSession) updateNarrBtn(false); };
    speechSynthesis.speak(u);
  }
  next();
}
function stopNarration() {
  narrSession++;
  narrAudio.pause();
  narrAudio.currentTime = 0;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  updateNarrBtn(false);
}
narrAudio.addEventListener('play',  () => updateNarrBtn(true));
narrAudio.addEventListener('pause', () => updateNarrBtn(false));
narrAudio.addEventListener('ended', () => updateNarrBtn(false));
// Se il file audio registrato non c'è ancora (o non si carica), passa alla voce sintetica.
// Questo guardiano (per "sessione", cioè per singola selezione di stanza) garantisce che il
// passaggio avvenga una volta sola anche se sia l'evento "error" sia il rifiuto della promise
// di play() scattano per lo stesso fallimento di caricamento — altrimenti la narrazione
// partiva due volte e si sentiva il messaggio ripetuto.
let fallbackDone = false;
function triggerFallback(room, session) {
  if (session !== narrSession || fallbackDone) return;
  fallbackDone = true;
  usingSynthesis = true;
  speakSynthetic(room, session);
}
narrAudio.addEventListener('error', () => {
  const session = narrSession;
  const room = ROOMS.find(r => document.getElementById('btn-' + r.id)?.classList.contains('active'));
  if (room && NARRATIONS[room.id]) triggerFallback(room, session);
});
function speakRoom(room, auto) {
  const text = NARRATIONS[room.id];
  const src  = AUDIO_SRC[room.id];
  if (!text) { narrBar.style.display = 'none'; return; }
  narrBar.style.display = 'flex';
  narrCap.textContent = ccEnabled ? text : '';
  stopNarration();
  fallbackDone = false;
  narrBtn.style.display = 'flex';
  if (!auto) return; // rispetta le regole autoplay del browser
  disarmFirstInteractionAutostart(); // la narrazione sta partendo comunque: non serve più il listener generico
  const session = narrSession;
  // Se non c'è ancora una registrazione pronta, la voce sintetica parte SUBITO, nello stesso
  // istante del click: tentare comunque di caricare un file che sappiamo non esserci non
  // guadagna nulla, e anzi il ritardo dell'esito di rete può far scadere, su alcuni browser, il
  // permesso concesso dal click prima ancora di arrivare a parlare (la voce restava muta, senza
  // errori visibili).
  if (src && AUDIO_PRONTO.has(room.id)) {
    usingSynthesis = false;
    narrAudio.src = src;
    narrAudio.play().catch(() => { triggerFallback(room, session); });
  } else {
    triggerFallback(room, session);
  }
}
narrBtn.addEventListener('click', () => {
  disarmFirstInteractionAutostart();
  const room = ROOMS.find(r => document.getElementById('btn-' + r.id)?.classList.contains('active'));
  if (usingSynthesis) {
    if (!('speechSynthesis' in window)) return;
    if (speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.pause();
    else if (speechSynthesis.paused) speechSynthesis.resume();
    else if (room) speakSynthetic(room, narrSession);
  } else {
    if (!narrAudio.src) return;
    if (!narrAudio.paused) narrAudio.pause();
    else narrAudio.play().catch(() => {});
  }
});
// Toggle sottotitoli
ccToggle.addEventListener('click', () => {
  ccEnabled = !ccEnabled;
  localStorage.setItem('tv-cc-enabled', ccEnabled ? 'on' : 'off');
  ccToggle.textContent = ccEnabled ? 'Nascondi sottotitoli' : 'Mostra sottotitoli';
  ccToggle.setAttribute('aria-pressed', String(ccEnabled));
  const room = ROOMS.find(r => document.getElementById('btn-' + r.id)?.classList.contains('active'));
  if (room) narrCap.textContent = ccEnabled ? (NARRATIONS[room.id] || '') : '';
});
ccToggle.textContent = ccEnabled ? 'Nascondi sottotitoli' : 'Mostra sottotitoli';
ccToggle.setAttribute('aria-pressed', String(ccEnabled));
// ── Seleziona stanza ──
function selectRoom(room, auto = true) {
  document.querySelectorAll('.tv-room-btn').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-selected', 'false');
    b.setAttribute('tabindex', '-1');
  });
  const btn = document.getElementById('btn-' + room.id);
  if (btn) { btn.classList.add('active'); btn.setAttribute('aria-selected', 'true'); btn.setAttribute('tabindex', '0'); }
  document.querySelectorAll('.tv-thumb').forEach(t => { t.classList.remove('active'); t.setAttribute('aria-pressed', 'false'); });
  const th = document.getElementById('thumb-' + room.id);
  if (th) { th.classList.add('active'); th.setAttribute('aria-pressed', 'true'); }
  document.getElementById('tv-icon').textContent  = room.icon;
  document.getElementById('tv-title').innerHTML   = room.title;
  document.getElementById('tv-desc').textContent  = room.desc;
  // Reset angolo visione e zoom
  lon = 0; lat = 0; autoRot = true;
  H_FOV = DEFAULT_HFOV; applyFov();
  document.getElementById('tv-placeholder').style.display = 'flex';
  document.getElementById('tv-info').style.display = 'none';
  loadPanorama(room.img);
  stopNarration();
  speakRoom(room, auto);
}
// ── Build pulsanti stanza ──
function buildButtons() {
  const wrap = document.getElementById('tv-rooms');
  ROOMS.forEach((r, i) => {
    const btn = document.createElement('button');
    btn.className = 'tv-room-btn'; btn.id = 'btn-' + r.id;
    btn.setAttribute('role','tab');
    btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
    btn.setAttribute('tabindex', i === 0 ? '0' : '-1');
    btn.textContent = r.icon + ' ' + r.label;
    btn.onclick = () => selectRoom(r, true);
    wrap.appendChild(btn);
  });
  const tabs = () => Array.from(wrap.querySelectorAll('.tv-room-btn'));
  wrap.addEventListener('keydown', e => {
    const list = tabs();
    const i = list.indexOf(document.activeElement);
    if (i === -1) return;
    let next = null;
    if (e.key === 'ArrowRight') next = list[(i + 1) % list.length];
    else if (e.key === 'ArrowLeft') next = list[(i - 1 + list.length) % list.length];
    else if (e.key === 'Home') next = list[0];
    else if (e.key === 'End') next = list[list.length - 1];
    if (next) { e.preventDefault(); next.focus(); next.click(); }
  });
}
function tvEsc(t){ return (t||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// ── Build miniature ──
function buildThumbs() {
  const wrap = document.getElementById('tv-thumbs');
  ROOMS.forEach(r => {
    const div = document.createElement('div');
    div.className = 'tv-thumb'; div.id = 'thumb-' + r.id;
    div.setAttribute('role','button'); div.setAttribute('aria-label', r.label);
    div.setAttribute('aria-pressed', 'false'); div.setAttribute('tabindex', '0');
    div.onclick = () => selectRoom(r, true);
    div.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectRoom(r, true); }
    });
    const img = new Image();
    img.onload  = () => { div.innerHTML = `<img src="${r.thumb}" alt="${tvEsc(r.label)}" loading="lazy"/><div class="tv-thumb-label">${tvEsc(r.label)}</div>`; };
    img.onerror = () => { div.innerHTML = `<div class="tv-thumb-placeholder"><span>${tvEsc(r.icon)}</span><span>${tvEsc(r.label)}</span></div>`; };
    img.src = r.thumb;
    wrap.appendChild(div);
  });
}
let firstInteractionArmed = true;
function disarmFirstInteractionAutostart() {
  if (!firstInteractionArmed) return;
  firstInteractionArmed = false;
  document.removeEventListener('pointerdown', onFirstInteraction);
  document.removeEventListener('keydown', onFirstInteraction);
}
function onFirstInteraction(e) {
  if (!firstInteractionArmed) return;
  if (e.target.closest && e.target.closest('.tv-room-btn, .tv-thumb, #tv-narr-btn, #tv-narr-cc-toggle')) return;
  disarmFirstInteractionAutostart();
  const room = ROOMS.find(r => document.getElementById('btn-' + r.id)?.classList.contains('active')) || ROOMS[0];
  speakRoom(room, true);
}
document.addEventListener('pointerdown', onFirstInteraction);
document.addEventListener('keydown', onFirstInteraction);
// ── Avvio ──
window.addEventListener('resize', resize);
resize();
render();
buildButtons();
buildThumbs();
selectRoom(ROOMS[0], false); // niente autoplay al primo caricamento (i browser lo bloccherebbero comunque): ci pensa onFirstInteraction sopra
</script>
</body>
</html>
