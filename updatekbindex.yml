name: Aggiorna indice di ricerca (kb-index.json)

# Si attiva a ogni push su main, ESCLUSI i push che toccano solo
# kb-index.json (per non innescare un loop infinito quando il workflow
# stesso lo modifica) — stesso schema già in uso per update-sitemap.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'kb-index.json'

permissions:
  contents: write

jobs:
  update-kb-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rigenera kb-index.json dal contenuto reale delle pagine
        run: node scripts/build-kb-index.js

      - name: Commit ed eventuale push, solo se qualcosa è cambiato
        run: |
          if git diff --quiet -- kb-index.json; then
            echo "Nessuna modifica di contenuto, niente da committare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kb-index.json
          git commit -m "chore: aggiorna automaticamente kb-index.json [skip ci]"
          git push
